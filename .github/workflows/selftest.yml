# Самопроверка на каждый коммит.
#
# Зачем: ошибка вроде забытого импорта раньше доезжала до робота за две минуты
# (столько между запусками автообновления) и укладывала сервис в перезапуск по
# кругу — 363 раза, прежде чем это заметили. Здесь она видна сразу и до того,
# как код уедет на робота.
#
# Тяжёлое не ставим. faster-whisper тянет за собой torch, webrtcvad требует
# компиляции, sounddevice — звуковой карты, которой у сборщика нет. Всё это
# selftest подменяет заглушками: он проверяет логику, а не железо.

name: Самопроверка

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # На роботе Python 3.11 — проверяем на том же, иначе смысл теряется.
          python-version: '3.11'

      - name: Поставить лёгкие зависимости
        # numpy нужен по-настоящему: на нём считается громкость и уровень
        # сигнала. anthropic — ради настоящих классов ошибок: заглушка не
        # поймает, если мы перепутаем тип исключения при обрыве связи.
        # pygame — ради лица робота: его кадры проверяются по пикселям на
        # заглушке экрана, без железа. Колесо готовое, ставится за секунды.
        run: pip install numpy anthropic websocket-client requests pygame

      - name: Самопроверка
        run: python voice/selftest.py

      - name: Мост «Anthropic → Ollama»
        # Поднимает настоящий сервер и стучится в него настоящим клиентом.
        # Порядок событий в потоке жёсткий, и клиент на нарушение отвечает
        # исключением посреди фразы — глазами это не проверить.
        run: python pc/selftest.py

      - name: Синтаксис остальных файлов
        # selftest импортирует не всё: сломанный отступ в модуле, который он не
        # трогает, иначе доедет до робота незамеченным.
        run: python -m compileall -q voice web pc face

      - name: Скрипты установки
        # Опечатка в них выясняется только на живом роботе, посреди установки.
        run: bash -n scripts/install.sh scripts/setup_voice.sh scripts/setup_face.sh scripts/update.sh
