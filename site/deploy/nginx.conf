# Пример конфигурации nginx для статической сборки сайта.
# Закрывает требования ТЗ: HTTPS и HSTS, HTTP/2, редирект http → https,
# 301 с адреса без завершающего слеша, кастомная 404, отдача llms.txt
# как text/plain и проксирование формы заявок на server/forms.mjs.
#
# Замените example.ru на реальный домен и пути к сертификатам.

server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    # ACME-проверка Let's Encrypt должна работать до редиректа
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.example.ru;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

    # Один канонический хост: www отдаём редиректом, чтобы не плодить дубли
    return 301 https://example.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.ru;

    root /var/www/marketplace-site/dist;
    index index.html;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Завершающий слеш обязателен (§3.2): без него — 301 на адрес со слешем.
    # Условие пропускает файлы с расширением: /llms.txt и /robots.txt слеш не получают.
    location ~ ^([^.\?]*[^/])$ {
        return 301 $scheme://$host$1/;
    }

    # llms.txt и llms-full.txt отдаём как текст в utf-8 (§5.2)
    location ~ ^/llms(-full)?\.txt$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /robots.txt {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.xml$ {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # Хэшированные ассеты Astro неизменяемы — кэшируем надолго
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /og/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Приём заявок с форм: обработчик из server/forms.mjs
    location /api/lead {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_except POST OPTIONS { deny all; }
    }

    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=600";
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
