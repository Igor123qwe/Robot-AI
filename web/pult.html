<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Робот — пульт</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1e2128;
    --line: #2c3038;
    --text: #e8eaed;
    --dim: #878d99;
    --accent: #4a9eff;
    --ok: #3ecf7e;
    --warn: #ffb020;
    --bad: #ff4d4d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
  }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  #conn { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  #conn.on { background: var(--ok); }
  #status { flex: 1; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .batt { display: flex; align-items: center; gap: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .batt-shell {
    width: 38px; height: 16px; border: 1.5px solid var(--dim);
    border-radius: 3px; position: relative; padding: 2px;
  }
  .batt-shell::after {
    content: ""; position: absolute; right: -4px; top: 4px;
    width: 2px; height: 6px; background: var(--dim); border-radius: 0 1px 1px 0;
  }
  #battFill { height: 100%; width: 0%; background: var(--ok); border-radius: 1px; transition: width .4s, background .4s; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* На широком мониторе колонку не растягиваем: иначе джойстики
     превращаются в эллипсы, а полоски колёс — в простыни. */
  .side {
    display: flex; flex-direction: column; min-height: 0;
    width: 100%; max-width: 620px; margin: 0 auto;
  }

  /* --- видео --- */
  #videoBox {
    position: relative; flex: 1; min-height: 0;
    background: #0b0d10; display: flex; align-items: center; justify-content: center;
  }
  #videoBox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #videoHint { color: var(--dim); font-size: 13px; text-align: center; padding: 0 20px; }
  /* Что робот сказал — субтитрами поверх картинки. Тем же местом он
     показывает, что расслышал от человека: без экрана и без SSH иначе не
     понять, дошла команда или нет. */
  #caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 10px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .8));
    font-size: 14px; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .25s;
  }
  #caption.on { opacity: 1; }
  #caption.mine { color: var(--dim); font-style: italic; }

  #sndBtn {
    flex: none; width: 30px; height: 26px; padding: 0;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
  }
  #sndBtn.on { color: var(--ok); border-color: var(--ok); }
  #micBtn {
    flex: none; width: 30px; height: 26px; padding: 0;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
  }
  #micBtn.on { color: var(--ok); border-color: var(--ok); }
  #micBtn.talking { color: var(--bad); border-color: var(--bad); }

  /* --- колёса --- */
  .wheels {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 8px 12px; border-top: 1px solid var(--line);
  }
  .wheel {
    background: var(--panel); border-radius: 6px; padding: 6px 8px;
    display: flex; align-items: center; gap: 8px; font-size: 12px;
  }
  .wheel .name { color: var(--dim); width: 22px; flex: none; }
  .wheel .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; }
  .wheel .bar i {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 0;
    background: var(--accent); border-radius: 3px; transition: width .05s, left .05s;
  }
  .wheel .val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }

  /* --- скорость --- */
  .speed { display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
  .speed label { font-size: 12px; color: var(--dim); flex: none; }
  .speed input { flex: 1; accent-color: var(--accent); }
  .speed .v { width: 62px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  /* Аварийный стоп. Заметный и крупный: жать будут в спешке, часто с телефона. */
  #stopBtn {
    flex: none; padding: 8px 16px; border: 0; border-radius: 8px;
    background: var(--bad); color: #fff; font-weight: 700; font-size: 14px;
    letter-spacing: .5px; cursor: pointer;
  }
  #stopBtn:active { filter: brightness(.8); }

  /* --- джойстики --- */
  .pads { display: flex; gap: 10px; padding: 4px 12px 12px; }
  .pad {
    flex: 1; aspect-ratio: 1; max-height: 40vh;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 50%; position: relative; overflow: hidden;
  }
  .pad::before, .pad::after {
    content: ""; position: absolute; background: var(--line);
  }
  .pad::before { left: 10%; right: 10%; top: 50%; height: 1px; }
  .pad::after { top: 10%; bottom: 10%; left: 50%; width: 1px; }
  .pad .cap {
    position: absolute; width: 34%; height: 34%; border-radius: 50%;
    background: var(--accent); opacity: .85;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .pad.turn .cap { background: var(--warn); }
  .pad .tag {
    position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--dim); pointer-events: none;
  }

  .row { display: flex; gap: 8px; padding: 0 12px 8px; }
  .row input[type=text] {
    flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  .row button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; font-size: 13px;
  }
  .row button:active { background: var(--line); }

  /* Широкий и низкий экран (ландшафт на телефоне, узкое окно на ПК):
     видео слева, управление справа — иначе джойстики уезжают за край. */
  @media (orientation: landscape) and (max-height: 640px) {
    main { flex-direction: row; }
    #videoBox { flex: 1 1 50%; border-right: 1px solid var(--line); }
    .side { flex: 1 1 50%; max-width: none; overflow-y: auto; }
    .pad { max-height: none; }
    .wheels { border-top: none; }
  }
</style>
</head>
<body>

<header>
  <span id="conn"></span>
  <span id="status">подключение…</span>
  <button id="micBtn" title="Говорить с роботом в микрофон этого компьютера">🎤</button>
  <button id="sndBtn" title="Разрешить роботу говорить через этот браузер">🔇</button>
  <span class="batt">
    <span class="batt-shell"><span id="battFill"></span></span>
    <span id="battText">— %</span>
    <span id="battVolt" style="color:var(--dim)">—&nbsp;В</span>
  </span>
</header>

<main>
  <div id="videoBox">
    <div id="videoHint">видео выключено<br>введите адрес IP Webcam ниже</div>
    <div id="caption"></div>
  </div>

  <div class="side">
  <div class="row">
    <input type="text" id="camUrl" placeholder="/camera — через робота" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="camBtn">Видео</button>
  </div>

  <div class="wheels">
    <div class="wheel"><span class="name">ПЛ</span><span class="bar"><i id="wFL"></i></span><span class="val" id="vFL">0.00</span></div>
    <div class="wheel"><span class="name">ПП</span><span class="bar"><i id="wFR"></i></span><span class="val" id="vFR">0.00</span></div>
    <div class="wheel"><span class="name">ЗЛ</span><span class="bar"><i id="wRL"></i></span><span class="val" id="vRL">0.00</span></div>
    <div class="wheel"><span class="name">ЗП</span><span class="bar"><i id="wRR"></i></span><span class="val" id="vRR">0.00</span></div>
  </div>

  <div class="speed">
    <label>предел</label>
    <input type="range" id="lim" min="5" max="80" value="30">
    <span class="v" id="limV">0.30 м/с</span>
    <button id="stopBtn" title="Немедленно остановить робота">СТОП</button>
  </div>

  <div class="pads">
    <div class="pad" id="padMove"><span class="cap"></span><span class="tag">ход</span></div>
    <div class="pad turn" id="padTurn"><span class="cap"></span><span class="tag">разворот</span></div>
  </div>
  </div>
</main>

<script>
'use strict';

// ── Параметры шасси WD550 ────────────────────────────────────────────────
const HALF_WHEELBASE = 0.0975;  // половина колёсной базы, м
const HALF_TRACK     = 0.0850;  // половина колеи, м
const LXY            = HALF_WHEELBASE + HALF_TRACK;
const MAX_WZ         = 2.0;     // макс. угловая скорость, рад/с
const SEND_HZ        = 15;

// ── Разрядная кривая 3S li-ion (В → %) ───────────────────────────────────
const CURVE = [
  [12.60, 100], [12.30, 90], [12.00, 75], [11.70, 60],
  [11.40, 50], [11.10, 45], [10.80, 25], [10.20, 8], [9.90, 0],
];

function voltToPercent(v) {
  if (v >= CURVE[0][0]) return 100;
  if (v <= CURVE[CURVE.length - 1][0]) return 0;
  for (let i = 0; i < CURVE.length - 1; i++) {
    const [vHi, pHi] = CURVE[i], [vLo, pLo] = CURVE[i + 1];
    if (v <= vHi && v >= vLo) {
      const k = (v - vLo) / (vHi - vLo);
      return pLo + k * (pHi - pLo);
    }
  }
  return 0;
}

// ── DOM ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const elConn = $('conn'), elStatus = $('status');
const elBattFill = $('battFill'), elBattText = $('battText'), elBattVolt = $('battVolt');
const elLim = $('lim'), elLimV = $('limV');
const wheelBar = { FL: $('wFL'), FR: $('wFR'), RL: $('wRL'), RR: $('wRR') };
const wheelVal = { FL: $('vFL'), FR: $('vFR'), RL: $('vRL'), RR: $('vRR') };

// ── Состояние ────────────────────────────────────────────────────────────
let limit = 0.30;          // м/с
const cmd = { x: 0, y: 0, wz: 0 };

elLim.addEventListener('input', () => {
  limit = elLim.value / 100;
  elLimV.textContent = limit.toFixed(2) + ' м/с';
});
elLim.dispatchEvent(new Event('input'));

// ── Джойстики ────────────────────────────────────────────────────────────
function makeJoystick(pad, onMove) {
  const cap = pad.querySelector('.cap');
  let pointerId = null;

  const place = (dx, dy) => {
    cap.style.left = (50 + dx * 33) + '%';
    cap.style.top  = (50 + dy * 33) + '%';
  };

  const handle = ev => {
    const r = pad.getBoundingClientRect();
    // нормируем в [-1..1] относительно центра
    let dx = (ev.clientX - r.left - r.width / 2) / (r.width / 2);
    let dy = (ev.clientY - r.top - r.height / 2) / (r.height / 2);
    // ограничиваем кругом
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    place(dx, dy);
    onMove(dx, dy);
  };

  const release = () => {
    // Захват снимаем раньше, чем забываем pointerId: иначе отпустить будет
    // уже нечего, и палец останется «прижатым» к пэду до конца жизни страницы.
    if (pointerId !== null && pad.hasPointerCapture(pointerId)) {
      pad.releasePointerCapture(pointerId);
    }
    pointerId = null;
    place(0, 0);
    onMove(0, 0);
  };

  pad.addEventListener('pointerdown', ev => {
    if (pointerId !== null) return;
    pointerId = ev.pointerId;
    pad.setPointerCapture(pointerId);
    handle(ev);
  });
  pad.addEventListener('pointermove', ev => {
    if (ev.pointerId === pointerId) handle(ev);
  });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) {
    pad.addEventListener(t, ev => { if (ev.pointerId === pointerId) release(); });
  }
  // Отдаём наружу: аварийный стоп обязан отпустить и сам джойстик. Иначе
  // палец остаётся на пэде, и первое же его шевеление возвращает команду —
  // робот поедет снова, хотя человек нажал СТОП.
  joysticks.push(release);
}

// Все созданные джойстики — чтобы стоп мог отпустить их разом.
const joysticks = [];

// Левый: ход во все стороны. Вверх = вперёд (+x), вправо = вправо.
// В ROS linear.y положительная — влево, поэтому знак инвертируем.
makeJoystick($('padMove'), (dx, dy) => {
  cmd.x = -dy * limit;
  cmd.y = -dx * limit;
});

// Правый: только горизонталь — разворот на месте.
// angular.z положительная — против часовой (влево).
makeJoystick($('padTurn'), (dx) => {
  cmd.wz = -dx * MAX_WZ * (limit / 0.80);   // предел действует и на разворот
});

// ── Кинематика меканума (для индикаторов) ────────────────────────────────
function wheelSpeeds(x, y, wz) {
  return {
    FL: x - y - LXY * wz,
    FR: x + y + LXY * wz,
    RL: x + y - LXY * wz,
    RR: x - y + LXY * wz,
  };
}

function drawWheels() {
  const w = wheelSpeeds(cmd.x, cmd.y, cmd.wz);
  const scale = Math.max(limit, 0.05) + LXY * MAX_WZ;
  for (const k of ['FL', 'FR', 'RL', 'RR']) {
    const v = w[k];
    const frac = Math.max(-1, Math.min(1, v / scale));
    const pct = Math.abs(frac) * 50;
    wheelBar[k].style.left  = (frac >= 0 ? 50 : 50 - pct) + '%';
    wheelBar[k].style.width = pct + '%';
    wheelVal[k].textContent = v.toFixed(2);
  }
}

// ── rosbridge ────────────────────────────────────────────────────────────
const ROSBRIDGE = 'ws://' + (location.hostname || '192.168.0.50') + ':9090';
let ws = null, wsReady = false, reconnectTimer = null;

function setStatus(text, ok) {
  elStatus.textContent = text;
  elConn.classList.toggle('on', !!ok);
}

// Только текст, без индикатора. Точка слева показывает связь с rosbridge, и
// микрофон к ней отношения не имеет: раньше она гасла от тишины в микрофоне
// при полностью живом соединении и так и оставалась красной — а по этой точке
// человек заранее понимает, сработает ли СТОП.
function setNote(text) {
  elStatus.textContent = text;
}

function connect() {
  clearTimeout(reconnectTimer);
  // Пока не доставлен стоп, шапку не трогаем: переподключение идёт каждые
  // две секунды и затирало единственное сообщение о том, что робот не
  // остановлен. Человек видел зелёное «подключено» и был уверен в обратном.
  if (!stopPending) setStatus('подключение к ' + ROSBRIDGE + ' …', false);
  try { ws = new WebSocket(ROSBRIDGE); }
  catch (e) { scheduleReconnect(); return; }

  ws.onopen = () => {
    wsReady = true;
    send({ op: 'advertise', topic: '/cmd_vel', type: 'geometry_msgs/msg/Twist' });
    send({ op: 'subscribe', topic: '/PowerVoltage', type: 'std_msgs/msg/Float32', throttle_rate: 1000 });
    if (stopPending) {
      // Человек жал СТОП, когда связи не было. Связь появилась — досылаем,
      // прежде чем сообщать, что всё хорошо.
      stopPending = false;
      for (const ms of [0, 60, 120, 180, 240]) setTimeout(sendZero, ms);
      setStatus('связь вернулась — стоп отправлен', true);
      return;
    }
    setStatus('подключено', true);
  };

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.op === 'publish' && msg.topic === '/PowerVoltage') {
      updateBattery(msg.msg.data);
    }
  };

  // Про недоставленный стоп в шапке важнее, чем про состояние связи: связь
  // человек и так видит по индикатору, а несработавшую кнопку — нет.
  ws.onclose = () => {
    wsReady = false;
    if (!stopPending) setStatus('связь потеряна', false);
    scheduleReconnect();
  };
  ws.onerror = () => { if (!stopPending) setStatus('ошибка соединения', false); };
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, 2000);
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// Публикуем, только когда джойстики заняты, плюс несколько нулей после
// отпускания. Раньше вкладка слала нули 15 раз в секунду круглосуточно, и
// голосовая команда «вперёд на метр» ехала рывками: две струи в один топик.
// А закрыть вкладку нельзя — она же динамик робота.
let idleZeros = 0;

function publishCmdVel() {
  if (!wsReady) return;
  const moving = cmd.x !== 0 || cmd.y !== 0 || cmd.wz !== 0;
  if (moving) {
    idleZeros = 3;            // после отпускания дошлём столько нулей
  } else if (idleZeros > 0) {
    idleZeros--;
  } else {
    return;                   // стоим — не мешаем голосовому управлению
  }
  send({
    op: 'publish',
    topic: '/cmd_vel',
    msg: {
      linear:  { x: cmd.x,  y: cmd.y, z: 0 },
      angular: { x: 0, y: 0, z: cmd.wz },
    },
  });
}

// Аварийный стоп: работает, даже когда робот едет по голосовой команде и
// физически не слышит «стоп» — пока говорит, микрофон заглушён.
// Пока взведён — в шапке висит «СТОП НЕ УШЁЛ», и переподключение не смеет
// написать поверх бодрое «подключено». Снимается только фактом отправки.
let stopPending = false;

function sendZero() {
  send({
    op: 'publish',
    topic: '/cmd_vel',
    msg: { linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } },
  });
}

function emergencyStop() {
  cmd.x = cmd.y = cmd.wz = 0;
  idleZeros = 0;
  // Отпускаем и сами джойстики: палец, оставшийся на пэде, вернёт команду
  // первым же шевелением, и робот поедет снова.
  for (const release of joysticks) release();

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    // Кнопка мигнула, а робот едет дальше — молчать об этом нельзя. И забыть
    // тоже нельзя: дошлём, как только связь вернётся.
    stopPending = true;
    setStatus('СТОП НЕ УШЁЛ — нет связи с роботом', false);
    return;
  }
  stopPending = false;

  // Пять нулей, разложенных по времени. Залпом в один тик их съедала
  // подписка робота, а эхо собственной поездки идёт каждые 66 мс и держало
  // окно занятым — кнопка не срабатывала вовсе. Четверти секунды хватает,
  // чтобы попасть между эхо; дольше растягивать нельзя, иначе заглушим и
  // новую команду, отданную сразу после стопа.
  for (const ms of [0, 60, 120, 180, 240]) setTimeout(sendZero, ms);
}

// ── Батарея ──────────────────────────────────────────────────────────────
// Когда в последний раз приходило напряжение. Показания обязаны протухать:
// если умерло шасси, а rosbridge жив, сообщения просто перестают идти — и
// раньше в шапке навсегда застывало бодрое «12.3 В, 90 %». Голосовая часть
// эту ошибку уже знает (ros.py, VOLTAGE_TTL), пульт — нет, а смотрят на заряд
// именно по нему, и сборку 3S нельзя переразряжать.
let battAt = 0;
const BATT_TTL = 10000;

function updateBattery(volt) {
  battAt = Date.now();
  const pct = voltToPercent(volt);
  elBattFill.style.width = pct.toFixed(0) + '%';
  elBattText.textContent = pct.toFixed(0) + ' %';
  elBattVolt.textContent = volt.toFixed(1) + ' В';
  elBattFill.style.background =
    volt < 10.8 ? 'var(--bad)' : volt < 11.4 ? 'var(--warn)' : 'var(--ok)';
}

function forgetBattery() {
  elBattFill.style.width = '0%';
  elBattText.textContent = '— %';
  elBattVolt.textContent = '— В';
}

setInterval(() => {
  if (battAt && Date.now() - battAt > BATT_TTL) {
    battAt = 0;
    forgetBattery();
  }
}, 1000);

// ── Камера (IP Webcam) ───────────────────────────────────────────────────
const camUrl = $('camUrl'), camBtn = $('camBtn'), videoBox = $('videoBox'), videoHint = $('videoHint');
camUrl.value = localStorage.getItem('robot.camUrl') || '';


// По умолчанию берём поток через робота: он сидит и в сети Ростелекома, и в
// сети Huawei, поэтому пульт открывается откуда угодно. Прямой адрес телефона
// оставлен на случай отладки — тогда браузер должен сам видеть телефон.
const PROXY_CAM = '/camera';

// «192.168.3.9» → «http://192.168.3.9:8080»: IP Webcam слушает 8080,
// и набирать схему с портом каждый раз с телефона неудобно.
function normalizeCamUrl(raw) {
  let s = raw.trim().replace(/\/+$/, '');
  if (!s) return PROXY_CAM;
  if (s.startsWith('/')) return s;         // путь на самом роботе
  if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
  // Разбираем адрес по-настоящему: IP Webcam показывает на экране телефона
  // ссылку сразу с путём (192.168.3.9:8080/video), и дописывание порта в
  // конец строки превращало её в мусор вида http://192.168.3.9/video:8080.
  let u;
  try { u = new URL(s); } catch (e) { return PROXY_CAM; }
  if (!u.port) u.port = 8080;
  const path = u.pathname.replace(/\/(video|shot\.jpg|audio\.wav)$/, '').replace(/\/$/, '');
  return u.origin + path;
}

camBtn.addEventListener('click', () => {
  const base = normalizeCamUrl(camUrl.value);
  camUrl.value = base;
  localStorage.setItem('robot.camUrl', base);

  const old = videoBox.querySelector('img');
  if (old) old.remove();

  // Прокси отдаёт поток прямо по /camera, у телефона он лежит в /video.
  const src = base.startsWith('/') ? base : base + '/video';
  const img = document.createElement('img');
  img.src = src;
  img.onerror = () => {
    img.remove();
    videoHint.style.display = '';
    videoHint.textContent = base.startsWith('/')
      ? 'робот не смог забрать поток с телефона — запущен ли сервер в IP Webcam?'
      : 'не удалось открыть ' + src;
  };
  videoHint.style.display = 'none';
  videoBox.appendChild(img);
});

camBtn.click();

// ── Голос робота ─────────────────────────────────────────────────────────
// Своего динамика у робота пока нет, поэтому говорит этот браузер: сервер
// присылает по SSE ссылку на реплику, мы её проигрываем. Браузеры не дают
// запускать звук без действия пользователя — отсюда кнопка.
const sndBtn = $('sndBtn'), caption = $('caption');
// Своё имя вкладки. Микрофон может быть только один: две открытые вкладки
// шлют звук в общий буфер, куски перемешиваются, и робот перестаёт разбирать
// речь. Сервер по этому имени решает, чья очередь.
const MIC_ID = Math.random().toString(36).slice(2, 10);
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
const player = new Audio();
// Радио — отдельный проигрыватель: реплики робота идут очередью и кончаются, а
// поток играет, пока не выключат. Смешивать их в одном нельзя.
const radio = new Audio();
radio.preload = 'none';
const RADIO_LOUD = 0.7;     // обычная громкость
const RADIO_QUIET = 0.12;   // пока робот говорит: слышно, но не мешает
const speechQueue = [];
let soundOn = false, playing = false, captionTimer = null;
let speech = null;

function setSound(on) {
  soundOn = on;
  sndBtn.textContent = on ? '🔊' : '🔇';
  sndBtn.classList.toggle('on', on);
  localStorage.setItem('soundOn', on ? '1' : '0');
  if (on) {
    // Разблокируем автовоспроизведение прямо в обработчике нажатия.
    player.src = SILENT_WAV;
    player.play().catch(() => {});
  } else {
    speechQueue.length = 0;
    player.pause();
    playing = false;
  }
  listen();   // сообщаем роботу, слышит его эта вкладка или нет
}

sndBtn.addEventListener('click', () => setSound(!soundOn));

function playNext() {
  if (playing || !speechQueue.length) {
    // Очередь пуста — радио можно вернуть к обычной громкости.
    if (!playing) radio.volume = RADIO_LOUD;
    return;
  }
  playing = true;
  // Под музыку робота не слышно. Приглушаем поток на время реплики — так же,
  // как это делает автомагнитола под навигатор.
  radio.volume = RADIO_QUIET;
  player.src = speechQueue.shift();
  player.play().catch(() => { playing = false; playNext(); });
}
player.addEventListener('ended', () => { playing = false; playNext(); });
player.addEventListener('error', () => { playing = false; playNext(); });
// Поток может не пойти уже после запуска: кодек не тот, станция легла,
// адрес переехал. Молчать об этом нельзя — робот-то отрапортовал «включаю»,
// и человек будет думать, что оглох он, а не радио.
radio.addEventListener('error', () => {
  if (radio.getAttribute('src')) showCaption('Радио не играет — станция молчит');
});

function showCaption(text, mine) {
  if (!text) return;
  caption.textContent = text;
  caption.classList.add('on');
  caption.classList.toggle('mine', !!mine);
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => caption.classList.remove('on'), 7000);
}

// EventSource переподключается сам, отдельная логика не нужна. Признак sound
// нужен роботу: он ждёт окончания реплики, только если её кто-то слышит.
function listen() {
  if (speech) speech.close();
  speech = new EventSource('/speak/events?sound=' + (soundOn ? '1' : '0'));
  speech.onmessage = ev => {
    let data;
    try { data = JSON.parse(ev.data); } catch (e) { return; }

    if (data.stop) {            // «замолчи»
      speechQueue.length = 0;
      player.pause();
      playing = false;
      radio.volume = RADIO_LOUD;
      return;
    }
    if (data.radio !== undefined) {   // включить или выключить радио
      if (!data.radio) {
        radio.pause();
        radio.removeAttribute('src');
        radio.load();
        return;
      }
      radio.src = data.radio;
      radio.volume = RADIO_LOUD;
      // Автовоспроизведение без жеста браузер запрещает. Звук в пульте
      // включают кнопкой — этот жест и разрешает поток.
      radio.play().catch(err => showCaption(
        err && err.name === 'NotAllowedError'
          ? 'Нажмите 🔈, чтобы включить звук'
          : 'Поток не пошёл: ' + (err && err.message || 'неизвестно')));
      return;
    }
    if (data.heard !== undefined) {   // что робот расслышал
      showCaption('вы: ' + data.heard, true);
      return;
    }
    if (data.status !== undefined) {  // состояние робота, а не чья-то реплика
      // Только текст: точка слева показывает связь с rosbridge, и молчащий
      // микрофон к ней отношения не имеет.
      elStatus.textContent = data.status;
      return;
    }

    showCaption(data.text);
    if (!soundOn) return;       // текст показываем всегда, звук — по кнопке
    speechQueue.push(data.url);
    playNext();
  };
}
listen();

// Автовоспроизведение требует жеста, поэтому включить звук за человека нельзя.
// Но если в прошлый раз он был включён, ждём первого касания страницы —
// иначе после каждой перезагрузки вкладка немая, а робот думает, что говорит.
if (localStorage.getItem('soundOn') === '1') {
  sndBtn.textContent = '🔈';
  sndBtn.title = 'Звук был включён — коснитесь страницы, чтобы вернуть';
  const unlock = ev => {
    window.removeEventListener('pointerdown', unlock);
    window.removeEventListener('keydown', unlock);
    // Если нажали на саму кнопку — её собственный обработчик уже включит
    // звук. Иначе он включит, а этот выключит обратно, и надо жать дважды.
    if (ev && ev.target && ev.target.closest && ev.target.closest('#sndBtn')) return;
    setSound(true);
  };
  window.addEventListener('pointerdown', unlock);
  window.addEventListener('keydown', unlock);
}

// ── Микрофон компьютера ──────────────────────────────────────────────────
// Робот обычно слушает телефон с IP Webcam, но для разговора за столом это
// лишнее звено: проще отдать ему микрофон этого компьютера. Вкладка шлёт
// сырой PCM 16 кГц на /listen, робот забирает его потоком.
//
// getUserMedia работает только в защищённом контексте. По http://192.168…
// браузер откажет — открывай пульт через localhost (см. README, туннель по
// ssh) или разреши этот адрес в chrome://flags.
const micBtn = $('micBtn');
const MIC_RATE = 16000;                   // столько ждёт пайплайн робота
const MIC_CHUNK = MIC_RATE / 4;           // четверть секунды в одном POST
let micOn = false, micCtx = null, micStream = null, micNode = null;
let micBuf = new Int16Array(0);           // готовый PCM, ждёт отправки
let micRaw = new Float32Array(0);         // сырой вход, ждёт пересчёта
let micPeak = 0, micSilentSince = 0;

// Браузер отдаёт микрофон на своей частоте (обычно 48 кГц) и просьбу про
// 16 кГц может проигнорировать — проверено: приходило 31 кГц вместо 16, то
// есть речь ускорялась в два раза. Поэтому пересчитываем сами, усреднением:
// это грубый фильтр низких частот, без него верхние частоты заворачиваются
// в слышимую полосу и шипящие превращаются в свист.
function downsample(input, inRate) {
  if (inRate === MIC_RATE) return { out: Float32Array.from(input), used: input.length };
  const ratio = inRate / MIC_RATE;
  const outLen = Math.floor(input.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const from = Math.floor(i * ratio);
    const to = Math.min(input.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = from; j < to; j++) sum += input[j];
    out[i] = sum / Math.max(1, to - from);
  }
  return { out, used: Math.floor(outLen * ratio) };
}

async function micStart() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setNote('микрофон запрещён: открой пульт через localhost');
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true,
               noiseSuppression: true, autoGainControl: true },
    });
  } catch (e) {
    setNote('микрофон не дали: ' + e.name);
    return;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (micCtx.state === 'suspended') await micCtx.resume();
  const rate = micCtx.sampleRate;
  const src = micCtx.createMediaStreamSource(micStream);
  micNode = micCtx.createScriptProcessor(4096, 1, 1);

  micNode.onaudioprocess = ev => {
    if (!micOn) return;
    // Пока играет ответ робота — не шлём: иначе он услышит сам себя,
    // если звук идёт из колонок, а не из наушников.
    if (playing) return;

    const input = ev.inputBuffer.getChannelData(0);
    const merged = new Float32Array(micRaw.length + input.length);
    merged.set(micRaw); merged.set(input, micRaw.length);
    const { out, used } = downsample(merged, rate);
    micRaw = merged.slice(used);          // хвост донесём следующим куском

    let peak = 0;
    const pcm = new Int16Array(out.length);
    for (let i = 0; i < out.length; i++) {
      const v = Math.max(-1, Math.min(1, out[i]));
      if (Math.abs(v) > peak) peak = Math.abs(v);
      pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    micLevel(peak);

    const all = new Int16Array(micBuf.length + pcm.length);
    all.set(micBuf); all.set(pcm, micBuf.length);
    micBuf = all;
    while (micBuf.length >= MIC_CHUNK) {
      const part = micBuf.slice(0, MIC_CHUNK);
      micBuf = micBuf.slice(MIC_CHUNK);
      fetch('/listen', {
        method: 'POST', body: part.buffer, headers: { 'X-Mic-Id': MIC_ID },
      }).then(r => {
        // 409 — микрофоном занята другая вкладка. Замолкаем и говорим об этом:
        // молча слать звук в никуда хуже всего, человек будет думать, что
        // робот оглох, и повторять всё громче.
        if (r.status === 409 && micOn) {
          micStop();
          setNote('микрофон занят другой вкладкой пульта — закрой лишнюю');
        }
      }).catch(() => {});
    }
  };

  src.connect(micNode);
  micNode.connect(micCtx.destination);   // без этого узел не тикает
  micOn = true;
  micPeak = 0;
  micSilentSince = Date.now();
  micBtn.textContent = '🎙';
  micBtn.classList.add('on');
  setNote('микрофон включён (' + rate + ' Гц) — говори «Кузя, …»');
}

// Видимый уровень: без него «робот меня не слышит» проверяется только
// командами на роботе. Кнопка краснеет, когда в микрофон реально говорят.
function micLevel(peak) {
  micPeak = Math.max(micPeak * 0.9, peak);
  micBtn.classList.toggle('talking', micPeak > 0.02);
  micBtn.title = 'уровень микрофона: ' + Math.round(micPeak * 100) + ' %';
  if (micPeak > 0.02) {
    micSilentSince = Date.now();
  } else if (micSilentSince && Date.now() - micSilentSince > 5000) {
    micSilentSince = 0;
    setNote('микрофон отдаёт тишину — проверь устройство записи в Windows');
  }
}

function micStop() {
  micOn = false;
  micBuf = new Int16Array(0);
  micRaw = new Float32Array(0);
  if (micNode) { micNode.disconnect(); micNode.onaudioprocess = null; micNode = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  micBtn.textContent = '🎤';
  micBtn.classList.remove('on', 'talking');
  micBtn.title = 'Говорить с роботом в микрофон этого компьютера';
}

micBtn.addEventListener('click', () => (micOn ? micStop() : micStart()));

// ── Главный цикл ─────────────────────────────────────────────────────────
connect();
setInterval(publishCmdVel, 1000 / SEND_HZ);
setInterval(drawWheels, 1000 / 30);

$('stopBtn').addEventListener('pointerdown', emergencyStop);
// Пробел — тот же стоп с клавиатуры, когда пульт открыт на ноутбуке.
window.addEventListener('keydown', ev => {
  if (ev.code === 'Space') { ev.preventDefault(); emergencyStop(); }
});

// Отпустили всё при уходе со страницы — робот не должен уехать. Обнулить
// команду мало: пока пэд считает палец прижатым, он вернёт её обратно, едва
// человек вернётся на вкладку и шевельнёт мышью.
function releaseAll() {
  for (const release of joysticks) release();
  cmd.x = cmd.y = cmd.wz = 0;
  publishCmdVel();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAll();
});
window.addEventListener('blur', releaseAll);
</script>
</body>
</html>
