<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Робот — пульт</title>
<style>
  /* Атрибут hidden задаёт display:none с нулевой специфичностью, и любое
     наше правило с display его молча перебивает. Спрятанное продолжает
     показываться, причём в неожиданном месте. Ставим это правило первым и
     с !important — дешевле, чем помнить про специфичность в каждом месте. */
  [hidden] { display: none !important; }
  :root {
    --bg: #14161a;
    --panel: #1e2128;
    --line: #2c3038;
    --text: #e8eaed;
    --dim: #878d99;
    --accent: #4a9eff;
    --ok: #3ecf7e;
    --warn: #ffb020;
    --bad: #ff4d4d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
  }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--line);
  }
  #conn { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  #conn.on { background: var(--ok); }
  #status { flex: 1; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .batt { display: flex; align-items: center; gap: 6px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .batt-shell {
    width: 38px; height: 16px; border: 1.5px solid var(--dim);
    border-radius: 3px; position: relative; padding: 2px;
  }
  .batt-shell::after {
    content: ""; position: absolute; right: -4px; top: 4px;
    width: 2px; height: 6px; background: var(--dim); border-radius: 0 1px 1px 0;
  }
  #battFill { height: 100%; width: 0%; background: var(--ok); border-radius: 1px; transition: width .4s, background .4s; }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* На широком мониторе колонку не растягиваем: иначе джойстики
     превращаются в эллипсы, а полоски колёс — в простыни. */
  .side {
    display: flex; flex-direction: column; min-height: 0;
    width: 100%; max-width: 620px; margin: 0 auto;
    /* Прокрутка, а не выдавливание: не поместилось — крути, но видео у
       робота не отбирай. */
    overflow-y: auto;
  }

  /* --- видео --- */
  #videoBox {
    /* Нижний предел обязателен. Панель дальномера растёт снизу, а видео
       сжимается первым, потому что только у него flex — и однажды оно
       сжимается в ноль. Двести пикселей робот всегда оставляет себе. */
    position: relative; flex: 1; min-height: 200px;
    background: #0b0d10; display: flex; align-items: center; justify-content: center;
  }
  #videoBox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #videoHint { color: var(--dim); font-size: 13px; text-align: center; padding: 0 20px; }
  /* Что робот сказал — субтитрами поверх картинки. Тем же местом он
     показывает, что расслышал от человека: без экрана и без SSH иначе не
     понять, дошла команда или нет. */
  #caption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 10px;
    background: linear-gradient(transparent, rgba(0, 0, 0, .8));
    font-size: 14px; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity .25s;
  }
  #caption.on { opacity: 1; }
  #caption.mine { color: var(--dim); font-style: italic; }

  #sndBtn {
    flex: none; width: 30px; height: 26px; padding: 0;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
  }
  #sndBtn.on { color: var(--ok); border-color: var(--ok); }
  #micBtn {
    flex: none; width: 30px; height: 26px; padding: 0;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
  }
  #micBtn.on { color: var(--ok); border-color: var(--ok); }
  #micBtn.talking { color: var(--bad); border-color: var(--bad); }
  #earBtn {
    flex: none; width: 30px; height: 26px; padding: 0;
    background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 6px; font-size: 14px;
  }
  #earBtn.on { color: var(--ok); border-color: var(--ok); }

  /* --- колёса --- */
  .wheels {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 8px 12px; border-top: 1px solid var(--line);
  }
  .wheel {
    background: var(--panel); border-radius: 6px; padding: 6px 8px;
    display: flex; align-items: center; gap: 8px; font-size: 12px;
  }
  .wheel .name { color: var(--dim); width: 22px; flex: none; }
  .wheel .bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; position: relative; overflow: hidden; }
  .wheel .bar i {
    position: absolute; top: 0; bottom: 0; left: 50%; width: 0;
    background: var(--accent); border-radius: 3px; transition: width .05s, left .05s;
  }
  .wheel .val { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }

  /* --- дальномер ---
     Восемь на восемь расстояний перед роботом. Показываем не ради красоты:
     до сих пор единственным способом узнать, что видит датчик, был заход по
     ssh и чтение простыни цифр. А смотреть в него приходится каждый раз,
     когда робот отказался ехать, — то есть тогда, когда человек и так занят
     роботом, а не терминалом. */
  .tof { padding: 6px 12px; }
  .tof-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: var(--dim); margin-bottom: 4px;
  }
  .tof-why { font-size: 11px; }
  /* Ширину ограничиваем, и это не косметика. Без предела восемь колонок
     растягиваются по всей панели, клетки становятся с палец, панель занимает
     весь экран — и выдавливает видео за нижний край. На снимке из пульта
     было ровно это: сетка есть, видео нет. */
  .tof-grid {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px;
    max-width: 232px;
  }
  .tof-grid i {
    aspect-ratio: 1; border-radius: 3px; font-style: normal;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-variant-numeric: tabular-nums;
    background: var(--line); color: var(--dim);
  }
  /* Цвет несёт смысл, а не украшает: красное — то, из-за чего робот встанет.
     «Не измерил» остаётся серым и пустым — незнание нельзя красить в цвет
     свободного пути, иначе стеклянная дверь выглядит как открытая. */
  .tof-grid i.близко { background: var(--bad); color: #fff; }
  .tof-grid i.рядом  { background: #7a5c1e; color: #fff; }
  .tof-grid i.далеко { background: #24402c; color: #9ccfae; }

  .tof-on { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .tof-aim {
    display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 8px;
    align-items: center; margin-top: 6px; font-size: 11px; color: var(--dim);
  }
  .tof-aim label { display: contents; }
  .tof-aim input { accent-color: var(--accent); }
  .aim-flip {
    display: flex; align-items: center; gap: 4px; grid-column: span 2;
  }
  .tof-aim button {
    grid-column: 1 / 3; padding: 4px 8px; border: 0; border-radius: 6px;
    background: var(--line); color: var(--fg); font-size: 11px; cursor: pointer;
  }

  /* Сетка поверх видео. Ради неё всё и затевалось: свести два поля зрения
     глазами — минутное дело, а калибровочная доска для 64 конусов шириной с
     ладонь на метре — из пушки по воробьям. */
  #tofOver {
    position: absolute; pointer-events: none;
    display: grid; grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    outline: 1px solid rgba(255, 255, 255, .35);
  }
  #tofOver i {
    font-style: normal; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 600;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
    border: 1px solid rgba(255, 255, 255, .08);
  }
  #tofOver i.близко { background: rgba(255, 77, 79, .45); color: #fff; }
  #tofOver i.рядом  { background: rgba(255, 190, 60, .30); color: #fff; }
  #tofOver i.далеко { background: rgba(90, 220, 140, .16); color: #cfe9d8; }

  /* --- скорость --- */
  .speed { display: flex; align-items: center; gap: 10px; padding: 6px 12px; }
  .speed label { font-size: 12px; color: var(--dim); flex: none; }
  .speed input { flex: 1; accent-color: var(--accent); }
  .speed .v { width: 62px; text-align: right; font-size: 13px; font-variant-numeric: tabular-nums; }
  /* Аварийный стоп. Заметный и крупный: жать будут в спешке, часто с телефона. */
  #stopBtn {
    flex: none; padding: 8px 16px; border: 0; border-radius: 8px;
    background: var(--bad); color: #fff; font-weight: 700; font-size: 14px;
    letter-spacing: .5px; cursor: pointer;
  }
  #stopBtn:active { filter: brightness(.8); }

  /* --- джойстики --- */
  .pads { display: flex; gap: 10px; padding: 4px 12px 12px; }
  .pad {
    flex: 1; aspect-ratio: 1; max-height: 40vh;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 50%; position: relative; overflow: hidden;
  }
  .pad::before, .pad::after {
    content: ""; position: absolute; background: var(--line);
  }
  .pad::before { left: 10%; right: 10%; top: 50%; height: 1px; }
  .pad::after { top: 10%; bottom: 10%; left: 50%; width: 1px; }
  .pad .cap {
    position: absolute; width: 34%; height: 34%; border-radius: 50%;
    background: var(--accent); opacity: .85;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .pad.turn .cap { background: var(--warn); }
  .pad .tag {
    position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: var(--dim); pointer-events: none;
  }

  .row { display: flex; gap: 8px; padding: 0 12px 8px; }
  .row input[type=text] {
    flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; font-size: 13px;
  }
  .row button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 12px; font-size: 13px;
  }
  .row button:active { background: var(--line); }

  /* Широкий и низкий экран (ландшафт на телефоне, узкое окно на ПК):
     видео слева, управление справа — иначе джойстики уезжают за край. */
  @media (orientation: landscape) and (max-height: 640px) {
    main { flex-direction: row; }
    #videoBox { flex: 1 1 50%; border-right: 1px solid var(--line); }
    .side { flex: 1 1 50%; max-width: none; overflow-y: auto; }
    .pad { max-height: none; }
    .wheels { border-top: none; }
  }
</style>
</head>
<body>

<header>
  <span id="conn"></span>
  <span id="status">подключение…</span>
  <button id="micBtn" title="Говорить с роботом в микрофон этого компьютера">🎤</button>
  <button id="earBtn" title="Я в наушниках — не подавлять эхо (робота слышно лучше)">🎧</button>
  <button id="sndBtn" title="Разрешить роботу говорить через этот браузер">🔇</button>
  <span class="batt">
    <span class="batt-shell"><span id="battFill"></span></span>
    <span id="battText">— %</span>
    <span id="battVolt" style="color:var(--dim)">—&nbsp;В</span>
  </span>
</header>

<main>
  <div id="videoBox">
    <div id="videoHint">видео выключено<br>введите адрес IP Webcam ниже</div>
    <div id="tofOver" hidden></div>
    <div id="caption"></div>
  </div>

  <div class="side">
  <div class="row">
    <input type="text" id="camUrl" placeholder="/camera — через робота" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="camBtn">Видео</button>
  </div>

  <div class="wheels">
    <div class="wheel"><span class="name">ПЛ</span><span class="bar"><i id="wFL"></i></span><span class="val" id="vFL">0.00</span></div>
    <div class="wheel"><span class="name">ПП</span><span class="bar"><i id="wFR"></i></span><span class="val" id="vFR">0.00</span></div>
    <div class="wheel"><span class="name">ЗЛ</span><span class="bar"><i id="wRL"></i></span><span class="val" id="vRL">0.00</span></div>
    <div class="wheel"><span class="name">ЗП</span><span class="bar"><i id="wRR"></i></span><span class="val" id="vRR">0.00</span></div>
  </div>

  <div class="tof" id="tofBox" hidden>
    <div class="tof-head">
      <span>что видит дальномер</span>
      <span class="tof-why" id="tofWhy"></span>
      <label class="tof-on"><input type="checkbox" id="tofOverOn"> на видео</label>
    </div>
    <div class="tof-grid" id="tofGrid"></div>
    <div class="tof-aim" id="tofAim" hidden>
      <label>вбок<input type="range" id="aimX" min="0" max="100" value="50"></label>
      <label>вверх<input type="range" id="aimY" min="0" max="100" value="50"></label>
      <label>ширина<input type="range" id="aimW" min="5" max="100" value="54"></label>
      <label>высота<input type="range" id="aimH" min="5" max="100" value="86"></label>
      <label class="aim-flip"><input type="checkbox" id="aimMirror"> зеркально</label>
      <label class="aim-flip"><input type="checkbox" id="aimUpside"> вверх ногами</label>
      <label class="aim-flip"><input type="checkbox" id="aimSwap"> поперёк (ряды↔колонки)</label>
      <button id="aimSave">запомнить роботу</button>
      <span class="tof-why" id="aimSaid"></span>
    </div>
  </div>

  <div class="speed">
    <label>предел</label>
    <input type="range" id="lim" min="5" max="80" value="30">
    <span class="v" id="limV">0.30 м/с</span>
    <button id="stopBtn" title="Немедленно остановить робота">СТОП</button>
  </div>

  <div class="pads">
    <div class="pad" id="padMove"><span class="cap"></span><span class="tag">ход</span></div>
    <div class="pad turn" id="padTurn"><span class="cap"></span><span class="tag">разворот</span></div>
  </div>
  </div>
</main>

<script>
'use strict';

// ── Параметры шасси WD550 ────────────────────────────────────────────────
const HALF_WHEELBASE = 0.0975;  // половина колёсной базы, м
const HALF_TRACK     = 0.0850;  // половина колеи, м
const LXY            = HALF_WHEELBASE + HALF_TRACK;
const MAX_WZ         = 2.0;     // макс. угловая скорость, рад/с
const SEND_HZ        = 15;

// ── Разрядная кривая 3S li-ion (В → %) ───────────────────────────────────
const CURVE = [
  [12.60, 100], [12.30, 90], [12.00, 75], [11.70, 60],
  [11.40, 50], [11.10, 45], [10.80, 25], [10.20, 8], [9.90, 0],
];

function voltToPercent(v) {
  if (v >= CURVE[0][0]) return 100;
  if (v <= CURVE[CURVE.length - 1][0]) return 0;
  for (let i = 0; i < CURVE.length - 1; i++) {
    const [vHi, pHi] = CURVE[i], [vLo, pLo] = CURVE[i + 1];
    if (v <= vHi && v >= vLo) {
      const k = (v - vLo) / (vHi - vLo);
      return pLo + k * (pHi - pLo);
    }
  }
  return 0;
}

// ── DOM ──────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const elConn = $('conn'), elStatus = $('status');
const elBattFill = $('battFill'), elBattText = $('battText'), elBattVolt = $('battVolt');
const elLim = $('lim'), elLimV = $('limV');
const wheelBar = { FL: $('wFL'), FR: $('wFR'), RL: $('wRL'), RR: $('wRR') };
const wheelVal = { FL: $('vFL'), FR: $('vFR'), RL: $('vRL'), RR: $('vRR') };

// ── Состояние ────────────────────────────────────────────────────────────
let limit = 0.30;          // м/с
const cmd = { x: 0, y: 0, wz: 0 };

elLim.addEventListener('input', () => {
  limit = elLim.value / 100;
  elLimV.textContent = limit.toFixed(2) + ' м/с';
});
elLim.dispatchEvent(new Event('input'));

// ── Джойстики ────────────────────────────────────────────────────────────
function makeJoystick(pad, onMove) {
  const cap = pad.querySelector('.cap');
  let pointerId = null;

  const place = (dx, dy) => {
    cap.style.left = (50 + dx * 33) + '%';
    cap.style.top  = (50 + dy * 33) + '%';
  };

  const handle = ev => {
    const r = pad.getBoundingClientRect();
    // нормируем в [-1..1] относительно центра
    let dx = (ev.clientX - r.left - r.width / 2) / (r.width / 2);
    let dy = (ev.clientY - r.top - r.height / 2) / (r.height / 2);
    // ограничиваем кругом
    const m = Math.hypot(dx, dy);
    if (m > 1) { dx /= m; dy /= m; }
    place(dx, dy);
    onMove(dx, dy);
  };

  const release = () => {
    // Захват снимаем раньше, чем забываем pointerId: иначе отпустить будет
    // уже нечего, и палец останется «прижатым» к пэду до конца жизни страницы.
    if (pointerId !== null && pad.hasPointerCapture(pointerId)) {
      pad.releasePointerCapture(pointerId);
    }
    pointerId = null;
    place(0, 0);
    onMove(0, 0);
  };

  pad.addEventListener('pointerdown', ev => {
    if (pointerId !== null) return;
    pointerId = ev.pointerId;
    pad.setPointerCapture(pointerId);
    handle(ev);
  });
  pad.addEventListener('pointermove', ev => {
    if (ev.pointerId === pointerId) handle(ev);
  });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) {
    pad.addEventListener(t, ev => { if (ev.pointerId === pointerId) release(); });
  }
  // Отдаём наружу: аварийный стоп обязан отпустить и сам джойстик. Иначе
  // палец остаётся на пэде, и первое же его шевеление возвращает команду —
  // робот поедет снова, хотя человек нажал СТОП.
  joysticks.push(release);
}

// Все созданные джойстики — чтобы стоп мог отпустить их разом.
const joysticks = [];

// Левый: ход во все стороны. Вверх = вперёд (+x), вправо = вправо.
// В ROS linear.y положительная — влево, поэтому знак инвертируем.
makeJoystick($('padMove'), (dx, dy) => {
  cmd.x = -dy * limit;
  cmd.y = -dx * limit;
});

// Правый: только горизонталь — разворот на месте.
// angular.z положительная — против часовой (влево).
makeJoystick($('padTurn'), (dx) => {
  cmd.wz = -dx * MAX_WZ * (limit / 0.80);   // предел действует и на разворот
});

// ── Кинематика меканума (для индикаторов) ────────────────────────────────
function wheelSpeeds(x, y, wz) {
  return {
    FL: x - y - LXY * wz,
    FR: x + y + LXY * wz,
    RL: x + y - LXY * wz,
    RR: x - y + LXY * wz,
  };
}

function drawWheels() {
  const w = wheelSpeeds(cmd.x, cmd.y, cmd.wz);
  const scale = Math.max(limit, 0.05) + LXY * MAX_WZ;
  for (const k of ['FL', 'FR', 'RL', 'RR']) {
    const v = w[k];
    const frac = Math.max(-1, Math.min(1, v / scale));
    const pct = Math.abs(frac) * 50;
    wheelBar[k].style.left  = (frac >= 0 ? 50 : 50 - pct) + '%';
    wheelBar[k].style.width = pct + '%';
    wheelVal[k].textContent = v.toFixed(2);
  }
}

// ── rosbridge ────────────────────────────────────────────────────────────
// По https обращаться к ws:// нельзя — браузер блокирует это как смешанное
// содержимое, и молча: джойстик просто перестал бы двигать робота. Поэтому
// с защищённой страницы идём к rosbridge через сам сервер пульта, /ros.
const ROSBRIDGE = location.protocol === 'https:'
  ? 'wss://' + location.host + '/ros'
  : 'ws://' + (location.hostname || '192.168.0.50') + ':9090';
let ws = null, wsReady = false, reconnectTimer = null;

function setStatus(text, ok) {
  elStatus.textContent = text;
  elConn.classList.toggle('on', !!ok);
}

// Только текст, без индикатора. Точка слева показывает связь с rosbridge, и
// микрофон к ней отношения не имеет: раньше она гасла от тишины в микрофоне
// при полностью живом соединении и так и оставалась красной — а по этой точке
// человек заранее понимает, сработает ли СТОП.
function setNote(text) {
  elStatus.textContent = text;
}

function connect() {
  clearTimeout(reconnectTimer);
  // Пока не доставлен стоп, шапку не трогаем: переподключение идёт каждые
  // две секунды и затирало единственное сообщение о том, что робот не
  // остановлен. Человек видел зелёное «подключено» и был уверен в обратном.
  if (!stopPending) setStatus('подключение к ' + ROSBRIDGE + ' …', false);
  try { ws = new WebSocket(ROSBRIDGE); }
  catch (e) { scheduleReconnect(); return; }

  ws.onopen = () => {
    wsReady = true;
    send({ op: 'advertise', topic: '/cmd_vel', type: 'geometry_msgs/msg/Twist' });
    send({ op: 'subscribe', topic: '/PowerVoltage', type: 'std_msgs/msg/Float32', throttle_rate: 1000 });
    if (stopPending) {
      // Человек жал СТОП, когда связи не было. Связь появилась — досылаем,
      // прежде чем сообщать, что всё хорошо.
      stopPending = false;
      for (const ms of [0, 60, 120, 180, 240]) setTimeout(sendZero, ms);
      setStatus('связь вернулась — стоп отправлен', true);
      return;
    }
    setStatus('подключено', true);
  };

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    if (msg.op === 'publish' && msg.topic === '/PowerVoltage') {
      updateBattery(msg.msg.data);
    }
  };

  // Про недоставленный стоп в шапке важнее, чем про состояние связи: связь
  // человек и так видит по индикатору, а несработавшую кнопку — нет.
  ws.onclose = () => {
    wsReady = false;
    if (!stopPending) setStatus('связь потеряна', false);
    scheduleReconnect();
  };
  ws.onerror = () => { if (!stopPending) setStatus('ошибка соединения', false); };
}

function scheduleReconnect() {
  clearTimeout(reconnectTimer);
  reconnectTimer = setTimeout(connect, 2000);
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// Публикуем, только когда джойстики заняты, плюс несколько нулей после
// отпускания. Раньше вкладка слала нули 15 раз в секунду круглосуточно, и
// голосовая команда «вперёд на метр» ехала рывками: две струи в один топик.
// А закрыть вкладку нельзя — она же динамик робота.
let idleZeros = 0;

function publishCmdVel() {
  if (!wsReady) return;
  const moving = cmd.x !== 0 || cmd.y !== 0 || cmd.wz !== 0;
  if (moving) {
    idleZeros = 3;            // после отпускания дошлём столько нулей
  } else if (idleZeros > 0) {
    idleZeros--;
  } else {
    return;                   // стоим — не мешаем голосовому управлению
  }
  send({
    op: 'publish',
    topic: '/cmd_vel',
    msg: {
      linear:  { x: cmd.x,  y: cmd.y, z: 0 },
      angular: { x: 0, y: 0, z: cmd.wz },
    },
  });
}

// Аварийный стоп: работает, даже когда робот едет по голосовой команде и
// физически не слышит «стоп» — пока говорит, микрофон заглушён.
// Пока взведён — в шапке висит «СТОП НЕ УШЁЛ», и переподключение не смеет
// написать поверх бодрое «подключено». Снимается только фактом отправки.
let stopPending = false;

function sendZero() {
  send({
    op: 'publish',
    topic: '/cmd_vel',
    msg: { linear: { x: 0, y: 0, z: 0 }, angular: { x: 0, y: 0, z: 0 } },
  });
}

function emergencyStop() {
  cmd.x = cmd.y = cmd.wz = 0;
  idleZeros = 0;
  // Отпускаем и сами джойстики: палец, оставшийся на пэде, вернёт команду
  // первым же шевелением, и робот поедет снова.
  for (const release of joysticks) release();

  if (!ws || ws.readyState !== WebSocket.OPEN) {
    // Кнопка мигнула, а робот едет дальше — молчать об этом нельзя. И забыть
    // тоже нельзя: дошлём, как только связь вернётся.
    stopPending = true;
    setStatus('СТОП НЕ УШЁЛ — нет связи с роботом', false);
    return;
  }
  stopPending = false;

  // Пять нулей, разложенных по времени. Залпом в один тик их съедала
  // подписка робота, а эхо собственной поездки идёт каждые 66 мс и держало
  // окно занятым — кнопка не срабатывала вовсе. Четверти секунды хватает,
  // чтобы попасть между эхо; дольше растягивать нельзя, иначе заглушим и
  // новую команду, отданную сразу после стопа.
  for (const ms of [0, 60, 120, 180, 240]) setTimeout(sendZero, ms);
}

// ── Батарея ──────────────────────────────────────────────────────────────
// Когда в последний раз приходило напряжение. Показания обязаны протухать:
// если умерло шасси, а rosbridge жив, сообщения просто перестают идти — и
// раньше в шапке навсегда застывало бодрое «12.3 В, 90 %». Голосовая часть
// эту ошибку уже знает (ros.py, VOLTAGE_TTL), пульт — нет, а смотрят на заряд
// именно по нему, и сборку 3S нельзя переразряжать.
let battAt = 0;
const BATT_TTL = 10000;

function updateBattery(volt) {
  battAt = Date.now();
  const pct = voltToPercent(volt);
  elBattFill.style.width = pct.toFixed(0) + '%';
  elBattText.textContent = pct.toFixed(0) + ' %';
  elBattVolt.textContent = volt.toFixed(1) + ' В';
  elBattFill.style.background =
    volt < 10.8 ? 'var(--bad)' : volt < 11.4 ? 'var(--warn)' : 'var(--ok)';
}

function forgetBattery() {
  elBattFill.style.width = '0%';
  elBattText.textContent = '— %';
  elBattVolt.textContent = '— В';
}

setInterval(() => {
  if (battAt && Date.now() - battAt > BATT_TTL) {
    battAt = 0;
    forgetBattery();
  }
}, 1000);

// ── Камера (IP Webcam) ───────────────────────────────────────────────────
const camUrl = $('camUrl'), camBtn = $('camBtn'), videoBox = $('videoBox'), videoHint = $('videoHint');
camUrl.value = localStorage.getItem('robot.camUrl') || '';


// По умолчанию берём поток через робота: он сидит и в сети Ростелекома, и в
// сети Huawei, поэтому пульт открывается откуда угодно. Прямой адрес телефона
// оставлен на случай отладки — тогда браузер должен сам видеть телефон.
const PROXY_CAM = '/camera';

// «192.168.3.9» → «http://192.168.3.9:8080»: IP Webcam слушает 8080,
// и набирать схему с портом каждый раз с телефона неудобно.
function normalizeCamUrl(raw) {
  let s = raw.trim().replace(/\/+$/, '');
  if (!s) return PROXY_CAM;
  if (s.startsWith('/')) return s;         // путь на самом роботе
  if (!/^https?:\/\//i.test(s)) s = 'http://' + s;
  // Разбираем адрес по-настоящему: IP Webcam показывает на экране телефона
  // ссылку сразу с путём (192.168.3.9:8080/video), и дописывание порта в
  // конец строки превращало её в мусор вида http://192.168.3.9/video:8080.
  let u;
  try { u = new URL(s); } catch (e) { return PROXY_CAM; }
  if (!u.port) u.port = 8080;
  const path = u.pathname.replace(/\/(video|shot\.jpg|audio\.wav)$/, '').replace(/\/$/, '');
  return u.origin + path;
}

// Что показываем сейчас. Нужно сторожу ниже: он переподключает поток, а для
// этого должен знать, что именно был должен показывать.
let видеоБаза = '';

function включитьВидео(base) {
  видеоБаза = base;
  const old = videoBox.querySelector('img');
  if (old) old.remove();

  // Прокси отдаёт поток прямо по /camera, у телефона он лежит в /video.
  // Метка времени — чтобы браузер не подсунул поток из кэша при
  // переподключении: он охотно отдаёт «тот же адрес» вместе с его концом.
  const src = (base.startsWith('/') ? base : base + '/video')
              + (base.includes('?') ? '&' : '?') + 't=' + Date.now();
  const img = document.createElement('img');
  img.src = src;
  img.onerror = () => {
    img.remove();
    videoHint.style.display = '';
    if (!base.startsWith('/')) { videoHint.textContent = 'не удалось открыть ' + src; return; }
    // Источников за /camera теперь два — своя камера и телефон, — и валить
    // всё на телефон нельзя: с воткнутой в робота камерой это сбивает с
    // толку. Спрашиваем у сервера, что именно не вышло: он вернёт ругань
    // ffmpeg («устройство занято», «нет такого формата») или отказ телефона.
    videoHint.textContent = 'видео не пошло — выясняю причину…';
    fetch('/camera/status')
      .then(r => r.json())
      .then(o => { videoHint.textContent = (o.source || 'камера') + ': ' + (o.detail || 'нет кадра'); })
      .catch(() => { videoHint.textContent = 'видео не пошло, и сервер не отвечает'; });
  };
  videoHint.style.display = 'none';
  videoBox.appendChild(img);
}

camBtn.addEventListener('click', () => {
  const base = normalizeCamUrl(camUrl.value);
  camUrl.value = base;
  localStorage.setItem('robot.camUrl', base);
  включитьВидео(base);
});

// Сторожа потока здесь БОЛЬШЕ НЕТ, и это осознанный откат.
//
// Он переподключал видео по признаку img.complete: у живого multipart-потока
// ресурс ещё грузится, значит complete равно false, а стало true — поток
// оборвался. Признак оказался ненадёжным: браузер помечает ресурс
// завершённым и на живом потоке, после первой же части. Сторож принимался
// пересоздавать картинку каждые несколько секунд, а между сносом старой и
// первым кадром новой — чернота. Лечение вышло хуже болезни, которую лечило.
//
// Настоящая причина зависаний была не здесь, а на сервере: раздача кадров
// обрывала сама себя ровно через минуту. Это исправлено там же, где сломано.
// Обрыв по другим причинам ловит img.onerror выше — он показывает, что
// именно сказал сервер, вместо того чтобы молча дёргать поток.

camBtn.click();

// ── Голос робота ─────────────────────────────────────────────────────────
// Своего динамика у робота пока нет, поэтому говорит этот браузер: сервер
// присылает по SSE ссылку на реплику, мы её проигрываем. Браузеры не дают
// запускать звук без действия пользователя — отсюда кнопка.
const sndBtn = $('sndBtn'), caption = $('caption');
// Своё имя вкладки. Микрофон может быть только один: две открытые вкладки
// шлют звук в общий буфер, куски перемешиваются, и робот перестаёт разбирать
// речь. Сервер по этому имени решает, чья очередь.
const MIC_ID = Math.random().toString(36).slice(2, 10);
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
const player = new Audio();
// Радио — отдельный проигрыватель: реплики робота идут очередью и кончаются, а
// поток играет, пока не выключат. Смешивать их в одном нельзя.
const radio = new Audio();
radio.preload = 'none';
let radioLoud = 0.7;        // обычная громкость, робот меняет её голосом
const RADIO_QUIET = 0.12;   // пока робот говорит или человек: слышно, но не мешает
// Радио — бесконечный поток, трек из Яндекса кончается. Разница только в
// этом, но она принципиальная: после трека кто-то должен поставить
// следующий, и этот кто-то — робот. Пульт обязан сказать ему «доиграл».
let trackMode = false;
const speechQueue = [];
let soundOn = false, playing = false, captionTimer = null;
let speech = null;

function setSound(on) {
  soundOn = on;
  sndBtn.textContent = on ? '🔊' : '🔇';
  sndBtn.classList.toggle('on', on);
  localStorage.setItem('soundOn', on ? '1' : '0');
  if (on) {
    // Разблокируем автовоспроизведение прямо в обработчике нажатия.
    player.src = SILENT_WAV;
    player.play().catch(() => {});
  } else {
    speechQueue.length = 0;
    player.pause();
    playing = false;
  }
  listen();   // сообщаем роботу, слышит его эта вкладка или нет
}

sndBtn.addEventListener('click', () => setSound(!soundOn));

// Приглушать музыку надо в двух случаях: когда говорит робот и когда говорит
// человек. Второе — не удобство, а слух: под музыку распознавание сыпалось
// с уверенности −0.25 до −0.75, а половина фраз возвращалась пустыми.
// Автомагнитола делает то же самое под навигатор, только здесь навигатор —
// это сам разговор.
let duckUntil = 0, learnUntil = 0;
// Во сколько раз сейчас тише играет музыка, чем на полной громкости. Единица
// значит «приводить нечего»: музыки нет или она и так на полной.
function долиМузыки() {
  if (!radio || radio.paused || !radioLoud) return 1;
  return Math.max(0.05, radio.volume / radioLoud);
}
function setRadioVolume() {
  const duck = playing || Date.now() < duckUntil;
  radio.volume = duck ? Math.min(RADIO_QUIET, radioLoud) : radioLoud;
}
// Микрофон тикает только когда он включён, а приглушение должно кончаться
// само в любом случае — иначе выключенный микрофон оставит музыку тихой.
setInterval(setRadioVolume, 300);

function playNext() {
  if (playing || !speechQueue.length) {
    if (!playing) setRadioVolume();
    return;
  }
  playing = true;
  setRadioVolume();
  player.src = speechQueue.shift();
  player.play().catch(() => { playing = false; playNext(); });
}
player.addEventListener('ended', () => { playing = false; playNext(); });
player.addEventListener('error', () => { playing = false; playNext(); });

// «Доиграл» — единственное, что пульт сообщает роботу по своей воле. Ошибку
// считаем тем же самым: битая ссылка не должна останавливать вечер, робот
// просто поставит следующую песню.
function trackDone(why) {
  if (!trackMode) return;
  trackMode = false;                 // одно сообщение на трек, не два
  fetch('/music/ended', { method: 'POST', body: why || '' }).catch(() => {});
}
radio.addEventListener('ended', () => trackDone('конец'));
// Поток может не пойти уже после запуска: кодек не тот, станция легла,
// адрес переехал. Молчать об этом нельзя — робот-то отрапортовал «включаю»,
// и человек будет думать, что оглох он, а не радио.
radio.addEventListener('error', () => {
  if (!radio.getAttribute('src')) return;
  if (trackMode) { trackDone('ошибка'); return; }
  showCaption('Радио не играет — станция молчит');
});

function playMusic(url) {
  radio.src = url;
  // Даём фону несколько секунд, чтобы подняться до уровня самой музыки, и всё
  // это время не приглушаем. Иначе музыка глушит себя сама: она только что
  // заиграла, фон ещё помнит тишину, и превышение над ним выглядит как
  // «человек заговорил» — песня начиналась с трёх секунд шёпота.
  learnUntil = Date.now() + FLOOR_LEARN;
  duckUntil = 0;
  setRadioVolume();
  // Автовоспроизведение без жеста браузер запрещает. Звук в пульте включают
  // кнопкой — этот жест и разрешает поток.
  radio.play().catch(err => {
    showCaption(err && err.name === 'NotAllowedError'
      ? 'Нажмите 🔈, чтобы включить звук'
      : 'Не пошло: ' + (err && err.message || 'неизвестно'));
    // Отказ в проигрывании — тоже конец трека. Иначе робот будет ждать
    // «доиграл» от песни, которая даже не начиналась.
    trackDone('не пустили');
  });
}

function stopMusic() {
  trackMode = false;
  radio.pause();
  radio.removeAttribute('src');
  radio.load();
}

function showCaption(text, mine) {
  if (!text) return;
  caption.textContent = text;
  caption.classList.add('on');
  caption.classList.toggle('mine', !!mine);
  clearTimeout(captionTimer);
  captionTimer = setTimeout(() => caption.classList.remove('on'), 7000);
}

// EventSource переподключается сам, отдельная логика не нужна. Признак sound
// нужен роботу: он ждёт окончания реплики, только если её кто-то слышит.
function listen() {
  if (speech) speech.close();
  speech = new EventSource('/speak/events?sound=' + (soundOn ? '1' : '0'));
  speech.onmessage = ev => {
    let data;
    try { data = JSON.parse(ev.data); } catch (e) { return; }

    if (data.stop) {            // «замолчи»
      speechQueue.length = 0;
      player.pause();
      playing = false;
      setRadioVolume();
      return;
    }
    if (data['громкость'] !== undefined) {   // громкость музыки, не голоса
      radioLoud = Math.min(1, Math.max(0, Number(data['громкость']) || 0));
      setRadioVolume();
      return;
    }
    if (data['трек'] !== undefined) {        // одна песня из Яндекса
      const трек = data['трек'] || {};
      if (!трек['адрес']) { stopMusic(); return; }
      // Флаг ставим до play(): ошибка может прилететь синхронно, и без него
      // робот не узнает, что песня не пошла, и будет ждать её вечно.
      trackMode = true;
      playMusic(трек['адрес']);
      if (трек['название']) showCaption('♪ ' + трек['название']);
      return;
    }
    if (data.radio !== undefined) {   // включить или выключить радио
      trackMode = false;
      if (!data.radio) { stopMusic(); return; }
      playMusic(data.radio);
      return;
    }
    if (data.heard !== undefined) {   // что робот расслышал
      showCaption('вы: ' + data.heard, true);
      return;
    }
    if (data.status !== undefined) {  // состояние робота, а не чья-то реплика
      // Только текст: точка слева показывает связь с rosbridge, и молчащий
      // микрофон к ней отношения не имеет.
      elStatus.textContent = data.status;
      return;
    }

    showCaption(data.text);
    if (!soundOn) return;       // текст показываем всегда, звук — по кнопке
    speechQueue.push(data.url);
    playNext();
  };
}
listen();

// Автовоспроизведение требует жеста, поэтому включить звук за человека нельзя.
// Но если в прошлый раз он был включён, ждём первого касания страницы —
// иначе после каждой перезагрузки вкладка немая, а робот думает, что говорит.
if (localStorage.getItem('soundOn') === '1') {
  sndBtn.textContent = '🔈';
  sndBtn.title = 'Звук был включён — коснитесь страницы, чтобы вернуть';
  const unlock = ev => {
    window.removeEventListener('pointerdown', unlock);
    window.removeEventListener('keydown', unlock);
    // Если нажали на саму кнопку — её собственный обработчик уже включит
    // звук. Иначе он включит, а этот выключит обратно, и надо жать дважды.
    if (ev && ev.target && ev.target.closest && ev.target.closest('#sndBtn')) return;
    setSound(true);
  };
  window.addEventListener('pointerdown', unlock);
  window.addEventListener('keydown', unlock);
}

// ── Микрофон компьютера ──────────────────────────────────────────────────
// Робот обычно слушает телефон с IP Webcam, но для разговора за столом это
// лишнее звено: проще отдать ему микрофон этого компьютера. Вкладка шлёт
// сырой PCM 16 кГц на /listen, робот забирает его потоком.
//
// getUserMedia работает только в защищённом контексте. По http://192.168…
// браузер откажет — открывай пульт через localhost (см. README, туннель по
// ssh) или разреши этот адрес в chrome://flags.
const micBtn = $('micBtn'), earBtn = $('earBtn');
const MIC_RATE = 16000;                   // столько ждёт пайплайн робота
const MIC_CHUNK = MIC_RATE / 4;           // четверть секунды в одном POST
let micOn = false, micCtx = null, micStream = null, micNode = null;
let micBuf = new Int16Array(0);           // готовый PCM, ждёт отправки
let micRaw = new Float32Array(0);         // сырой вход, ждёт пересчёта
let micPeak = 0, micSilentSince = 0;

// Наушники. Эхоподавление браузера придумано против колонок: оно берёт то,
// что играет система, и вычитает это из микрофона. Когда играет музыка, оно
// работает непрерывно — и глушит заодно живой голос, потому что отличить
// «остаток эха» от «человек говорит поверх» ему нечем. На живом роботе это
// выглядело так: включили музыку — распознавание с −0.25 упало до −0.75, а
// половина фраз вернулась пустыми, хотя человек был в наушниках и физически
// эха не существовало.
//
// В наушниках подавлять нечего, поэтому просто выключаем. На колонках
// оставляем: там эхо настоящее.
// Телефон отличаем по грубому указателю: пальцем, а не мышью. На компьютере
// пульт открывают в наушниках — тогда подавлять эхо вредно, оно съедает и
// голос человека. На телефоне наушников нет, микрофон и динамик в одном
// корпусе, и без подавления звук идёт сплошняком: робот не видит пауз, не
// может нарезать фразы и выбрасывает всё как «непрерывный звук дольше 20 с».
// Проверено на живом роботе — с телефона не разобралось ни одной фразы.
const ЭТО_ТЕЛЕФОН = window.matchMedia('(pointer: coarse)').matches;
const выбранное = localStorage.getItem('earsOn');
let earsOn = выбранное === null ? !ЭТО_ТЕЛЕФОН : выбранное !== '0';

function setEars(on) {
  earsOn = on;
  earBtn.textContent = on ? '🎧' : '🔈';
  earBtn.classList.toggle('on', on);
  earBtn.title = on
    ? 'Я в наушниках: эхоподавление выключено, робот слышит чище'
    : 'Звук из колонок: эхоподавление включено';
  localStorage.setItem('earsOn', on ? '1' : '0');
  // Правку можно применить на лету, не роняя поток: пересоздание микрофона
  // на три секунды отдало бы его другой вкладке (см. X-Mic-Id).
  const track = micStream && micStream.getAudioTracks()[0];
  if (track) {
    track.applyConstraints(micConstraints().audio).catch(() => {
      if (micOn) { micStop(); micStart(); }
    });
  }
}

function micConstraints() {
  return { audio: { channelCount: 1, echoCancellation: !earsOn,
                    noiseSuppression: true, autoGainControl: true } };
}

earBtn.addEventListener('click', () => setEars(!earsOn));
setEars(earsOn);

// Браузер отдаёт микрофон на своей частоте (обычно 48 кГц) и просьбу про
// 16 кГц может проигнорировать — проверено: приходило 31 кГц вместо 16, то
// есть речь ускорялась в два раза. Поэтому пересчитываем сами, усреднением:
// это грубый фильтр низких частот, без него верхние частоты заворачиваются
// в слышимую полосу и шипящие превращаются в свист.
function downsample(input, inRate) {
  if (inRate === MIC_RATE) return { out: Float32Array.from(input), used: input.length };
  const ratio = inRate / MIC_RATE;
  const outLen = Math.floor(input.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const from = Math.floor(i * ratio);
    const to = Math.min(input.length, Math.floor((i + 1) * ratio));
    let sum = 0;
    for (let j = from; j < to; j++) sum += input[j];
    out[i] = sum / Math.max(1, to - from);
  }
  return { out, used: Math.floor(outLen * ratio) };
}

async function micStart() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setNote('микрофон запрещён: открой пульт через localhost');
    return;
  }
  try {
    micStream = await navigator.mediaDevices.getUserMedia(micConstraints());
  } catch (e) {
    setNote('микрофон не дали: ' + e.name);
    return;
  }
  micCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (micCtx.state === 'suspended') await micCtx.resume();
  const rate = micCtx.sampleRate;
  const src = micCtx.createMediaStreamSource(micStream);
  micNode = micCtx.createScriptProcessor(4096, 1, 1);

  micNode.onaudioprocess = ev => {
    if (!micOn) return;
    // Пока играет ответ робота — не шлём: иначе он услышит сам себя,
    // если звук идёт из колонок, а не из наушников.
    if (playing) return;

    const input = ev.inputBuffer.getChannelData(0);
    const merged = new Float32Array(micRaw.length + input.length);
    merged.set(micRaw); merged.set(input, micRaw.length);
    const { out, used } = downsample(merged, rate);
    micRaw = merged.slice(used);          // хвост донесём следующим куском

    let peak = 0;
    const pcm = new Int16Array(out.length);
    for (let i = 0; i < out.length; i++) {
      const v = Math.max(-1, Math.min(1, out[i]));
      if (Math.abs(v) > peak) peak = Math.abs(v);
      pcm[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    micLevel(peak);

    const all = new Int16Array(micBuf.length + pcm.length);
    all.set(micBuf); all.set(pcm, micBuf.length);
    micBuf = all;
    while (micBuf.length >= MIC_CHUNK) {
      const part = micBuf.slice(0, MIC_CHUNK);
      micBuf = micBuf.slice(MIC_CHUNK);
      fetch('/listen', {
        method: 'POST', body: part.buffer, headers: { 'X-Mic-Id': MIC_ID },
      }).then(r => {
        // 409 — микрофоном занята другая вкладка. Замолкаем и говорим об этом:
        // молча слать звук в никуда хуже всего, человек будет думать, что
        // робот оглох, и повторять всё громче.
        if (r.status === 409 && micOn) {
          micStop();
          setNote('микрофон занят другой вкладкой пульта — закрой лишнюю');
        }
      }).catch(() => {});
    }
  };

  src.connect(micNode);
  micNode.connect(micCtx.destination);   // без этого узел не тикает
  micOn = true;
  micPeak = 0;
  micSilentSince = Date.now();
  // Микрофон часто включают под уже играющую песню, и тогда фону неоткуда
  // узнать её уровень: быстрое доучивание заводится только при пуске музыки.
  // Без этого первые полминуты музыка качалась тихо-громко впустую. Когда
  // музыки нет, окна не открываем: оно бы выучило саму речь, и приглушение
  // перестало бы срабатывать.
  if (radio && !radio.paused) learnUntil = Date.now() + FLOOR_LEARN;
  micBtn.textContent = '🎙';
  micBtn.classList.add('on');
  setNote('микрофон включён (' + rate + ' Гц, '
          + (earsOn ? 'наушники' : 'колонки') + ') — говори «Кузя, …»');
}

// Фон: то, что микрофон слышит просто так — комната, вентилятор, а когда
// играет музыка, то и она. Растёт медленно, падает быстро: иначе собственная
// речь человека затянула бы фон наверх и приглушение перестало бы срабатывать.
//
// Держим его в пересчёте на полную громкость музыки, и это главное. Пока фон
// мерился как есть, приглушение кормило само себя: убавили музыку — фон уехал
// вниз вслед за ней — музыка вернулась на полную — это прочиталось как «кто-то
// заговорил» — убавили снова. В тишине музыка качалась тихо-громко больше
// восьмидесяти процентов времени, и выхода из этого не было.
let micFloor = 0.02;
// Полминуты на подъём. Раньше стояла сотая доля за блок — это восемь секунд, и
// собственная речь человека затягивала фон наверх за пару секунд: на длинной
// фразе музыка возвращалась на полную прямо посреди разговора. Фон комнаты
// так быстро не меняется, спешить ему некуда.
const FLOOR_UP = 0.002, FLOOR_DOWN = 0.08;
// Сразу после включения музыки фон догоняет её быстро и приглушение молчит:
// см. playMusic. Полторы секунды — это меньше, чем вступление любой песни.
const FLOOR_FAST = 0.25, FLOOR_LEARN = 1500;
// Насколько громче ожидаемого — это уже человек, а не комната. Считаем запасом
// над ожидаемым уровнем, а не разами от фона: разами порог обгонял единицу —
// физический предел шкалы — уже при музыке чуть громче середины, и приглушение
// не срабатывало вовсе. То есть рабочего режима не было ни одного: фон не
// выучен — вечное качание, выучен — приглушение мертво.
const VOICE_OVER = 3.5;
const ЗАПАС_МИН = 0.06;   // чтобы в тишине не приглушать от скрипа стула
const ЗАПАС_МАКС = 0.20;  // чтобы порог не уезжал за предел шкалы
const DUCK_HOLD = 1500;   // мс: столько держим музыку тихой после последнего слова
// Сколько блоков подряд должно быть громко, чтобы это считалось речью. Блок —
// около 85 мс, так что четыре это треть секунды непрерывного звука. Звон
// посуды, хлопок двери и скрип стула в это не укладываются, а слово — да.
// Без счётчика музыка приглушалась на каждый шорох в комнате: на живом роботе
// это выглядело как «при каждом звуке уменьшает громкость», и правильно
// выглядело — приглушал я, а не Яндекс.
const VOICE_RUN = 4;
let loudRun = 0;

// Видимый уровень: без него «робот меня не слышит» проверяется только
// командами на роботе. Кнопка краснеет, когда в микрофон реально говорят.
function micLevel(peak) {
  micPeak = Math.max(micPeak * 0.9, peak);
  micBtn.classList.toggle('talking', micPeak > 0.02);
  micBtn.title = 'уровень микрофона: ' + Math.round(micPeak * 100) + ' %';

  const учимся = Date.now() < learnUntil;
  const вверх = учимся ? FLOOR_FAST : FLOOR_UP;
  const доля = долиМузыки();
  // Приводим услышанное к полной громкости музыки — иначе фон поедет вслед за
  // приглушением. Комнатный шум при этом слегка завышается, но он мал.
  const приведённый = peak / доля;
  micFloor += (приведённый - micFloor)
              * (приведённый > micFloor ? вверх : FLOOR_DOWN);
  // Сколько микрофон должен слышать прямо сейчас, при нынешней громкости.
  const ожидаем = micFloor * доля;
  const запас = Math.min(ЗАПАС_МАКС,
                         Math.max(ЗАПАС_МИН, ожидаем * (VOICE_OVER - 1)));
  const громко = peak > ожидаем + запас;
  loudRun = громко && !учимся ? loudRun + 1 : 0;
  if (loudRun >= VOICE_RUN) duckUntil = Date.now() + DUCK_HOLD;
  setRadioVolume();

  if (micPeak > 0.02) {
    micSilentSince = Date.now();
  } else if (micSilentSince && Date.now() - micSilentSince > 5000) {
    micSilentSince = 0;
    setNote('микрофон отдаёт тишину — проверь устройство записи в Windows');
  }
}

function micStop() {
  micOn = false;
  micBuf = new Int16Array(0);
  micRaw = new Float32Array(0);
  micFloor = 0.02;
  // Счётчик громких блоков тоже на ноль. Без этого микрофон, выключившийся сам
  // (сервер отвечает 409, когда слушает кто-то другой), при следующем включении
  // приглушал музыку от первого же звука вместо положенных четырёх блоков.
  loudRun = 0;
  duckUntil = 0;
  if (micNode) { micNode.disconnect(); micNode.onaudioprocess = null; micNode = null; }
  if (micCtx) { micCtx.close(); micCtx = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  micBtn.textContent = '🎤';
  micBtn.classList.remove('on', 'talking');
  micBtn.title = 'Говорить с роботом в микрофон этого компьютера';
}

micBtn.addEventListener('click', () => (micOn ? micStop() : micStart()));

// ── Главный цикл ─────────────────────────────────────────────────────────
connect();
// --- дальномер ---------------------------------------------------------
// Сетку выкладывает голосовая служба, сервер её только отдаёт: порт не
// читается вдвоём, и второй читатель отнял бы байты у самого робота.
const tofBox = document.getElementById('tofBox');
const tofGrid = document.getElementById('tofGrid');
const tofWhy = document.getElementById('tofWhy');
let кадровСетки = 0;
for (let i = 0; i < 64; i++) tofGrid.appendChild(document.createElement('i'));

function drawTof(d) {
  placeOverlay();
  if (!d || !d.есть) {
    // Прятать целиком нельзя: исчезнувшая панель читается как «всё хорошо».
    tofBox.hidden = false;
    tofWhy.textContent = (d && d.почему) || 'нет связи';
    tofGrid.querySelectorAll('i').forEach(c => {
      c.className = ''; c.textContent = '';
    });
    return;
  }
  tofBox.hidden = false;
  // Возраст сетки. Ради него это и показывается: когда видео встаёт, по
  // одной картинке не понять, встал робот, встала сеть или встал только
  // показ. Если числа тут идут и возраст мал — жив и робот, и связь, а
  // виновато видео. Если возраст растёт — молчит сам робот.
  tofWhy.textContent = (d.возраст !== undefined)
    ? d.возраст.toFixed(1) + ' с назад, кадр ' + (++кадровСетки)
    : '';
  const стоп = d.стоп || 0.35;
  const ячейки = tofGrid.querySelectorAll('i');
  for (let р = 0; р < 8; р++) {
    for (let к = 0; к < 8; к++) {
      // Показываем сразу так, как галки просят. Иначе человек их крутит, а
      // картинка не меняется до перезапуска службы — и он решает, что галки
      // не работают. Порядок тот же, что у робота: сперва поперёк (оно
      // решает, что вообще считать рядом), потом ряды, потом колонки.
      let р2 = aimUpside.checked ? 7 - р : р;
      let к2 = aimMirror.checked ? 7 - к : к;
      const м = aimSwap.checked ? d.сетка[к2][р2] : d.сетка[р2][к2];
      const c = ячейки[р * 8 + к];
      const o = tofOver.children[р * 8 + к];
      if (!(м > 0)) {                 // ноль — «не измерил», а не «ноль метров»
        c.className = ''; c.textContent = '';
        o.className = ''; o.textContent = '';
      } else {
        c.className = м < стоп ? 'близко' : (м < 0.7 ? 'рядом' : 'далеко');
        c.textContent = м.toFixed(1);
        o.className = c.className;
        o.textContent = м.toFixed(1);
      }
    }
  }
}

// --- наложение на видео ------------------------------------------------
const tofOver = document.getElementById('tofOver');
const tofOverOn = document.getElementById('tofOverOn');
const tofAim = document.getElementById('tofAim');
const aim = {
  x: document.getElementById('aimX'), y: document.getElementById('aimY'),
  w: document.getElementById('aimW'), h: document.getElementById('aimH'),
};
const aimSaid = document.getElementById('aimSaid');
const aimMirror = document.getElementById('aimMirror');
const aimUpside = document.getElementById('aimUpside');
const aimSwap = document.getElementById('aimSwap');
for (let i = 0; i < 64; i++) tofOver.appendChild(document.createElement('i'));

fetch('/tof/aim').then(r => r.json()).then(п => {
  aim.x.value = Math.round(п.x * 100); aim.y.value = Math.round(п.y * 100);
  aim.w.value = Math.round(п.ш * 100); aim.h.value = Math.round(п.в * 100);
  aimMirror.checked = !!п.зеркало;
  aimUpside.checked = !!п.вверхногами;
  aimSwap.checked = !!п.поперёк;
  placeOverlay();
}).catch(() => {});

// Кладём сетку на КАРТИНКУ, а не на её чёрную рамку. object-fit: contain
// вписывает кадр в блок с полями, и если считать от блока, сетка съезжает
// ровно на ширину этих полей — тем заметнее, чем уже окно.
function placeOverlay() {
  const img = videoBox.querySelector('img');
  if (!img || !img.naturalWidth) { tofOver.hidden = true; return; }
  const бок = videoBox.getBoundingClientRect();
  const кадр = img.getBoundingClientRect();
  const к = Math.min(кадр.width / img.naturalWidth, кадр.height / img.naturalHeight);
  const ш = img.naturalWidth * к, в = img.naturalHeight * к;
  const л = кадр.left - бок.left + (кадр.width - ш) / 2;
  const т = кадр.top - бок.top + (кадр.height - в) / 2;
  const дш = ш * aim.w.value / 100, дв = в * aim.h.value / 100;
  tofOver.style.left = (л + ш * aim.x.value / 100 - дш / 2) + 'px';
  tofOver.style.top = (т + в * aim.y.value / 100 - дв / 2) + 'px';
  tofOver.style.width = дш + 'px';
  tofOver.style.height = дв + 'px';
  tofOver.hidden = !tofOverOn.checked;
  // Когда сетка лежит на видео, отдельный квадрат под ним — то же самое
  // дважды и полпанели впустую. Прячем, но только если наложение правда
  // рисуется: при выключенном видео квадрат остаётся единственным способом
  // увидеть, что там у датчика.
  tofGrid.hidden = !tofOver.hidden;
}

tofOverOn.addEventListener('change', () => {
  tofAim.hidden = !tofOverOn.checked;
  placeOverlay();
});
Object.values(aim).forEach(п => п.addEventListener('input', placeOverlay));
window.addEventListener('resize', placeOverlay);

document.getElementById('aimSave').addEventListener('click', () => {
  const тело = JSON.stringify({
    x: aim.x.value / 100, y: aim.y.value / 100,
    ш: aim.w.value / 100, в: aim.h.value / 100,
    зеркало: aimMirror.checked, вверхногами: aimUpside.checked,
    поперёк: aimSwap.checked,
  });
  aimSaid.textContent = 'запоминаю…';
  fetch('/tof/aim', { method: 'POST', body: тело })
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(() => { aimSaid.textContent = 'запомнил'; })
    .catch(e => { aimSaid.textContent = 'не вышло: ' + e; });
});

setInterval(() => {
  // Свёрнутую вкладку не опрашиваем. Пульт держат открытым часами, и два
  // запроса в секунду в никуда — это лишние соединения к роботу и лишняя
  // работа плате, у которой есть занятия поважнее.
  if (document.hidden) return;
  fetch('/tof').then(r => r.json()).then(drawTof)
               .catch(() => drawTof(null));
}, 500);

setInterval(publishCmdVel, 1000 / SEND_HZ);
setInterval(drawWheels, 1000 / 30);

$('stopBtn').addEventListener('pointerdown', emergencyStop);
// Пробел — тот же стоп с клавиатуры, когда пульт открыт на ноутбуке.
window.addEventListener('keydown', ev => {
  if (ev.code === 'Space') { ev.preventDefault(); emergencyStop(); }
});

// Отпустили всё при уходе со страницы — робот не должен уехать. Обнулить
// команду мало: пока пэд считает палец прижатым, он вернёт её обратно, едва
// человек вернётся на вкладку и шевельнёт мышью.
function releaseAll() {
  for (const release of joysticks) release();
  cmd.x = cmd.y = cmd.wz = 0;
  publishCmdVel();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) releaseAll();
});
window.addEventListener('blur', releaseAll);
</script>
</body>
</html>
