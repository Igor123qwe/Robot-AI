<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Кузя</title>
<!-- Без этого браузер сам просит /avatar/favicon.ico, получает 404 и пишет
     это в консоль — а console.error слушает kuzya_pc.py и ругается в лог,
     будто со страницей что-то не так. Пустая иконка — запроса не будет. -->
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0b0f14; overflow: hidden; }
  canvas { display: block; }
  #беда {
    position: fixed; left: 10px; top: 10px; right: 10px;
    color: #ffb020; font: 14px/1.4 sans-serif; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div id="беда"></div>

<script>
"use strict";
/*
 * ЧТО ЭТА СТРАНИЦА ЗНАЕТ. Ничего про робота — ровно как face/face.py на
 * самом роботе. Она спрашивает /state десять раз в секунду (тот же темп,
 * каким голос пишет face.json) и красит модель по тому, что придёт. Решение
 * «что сейчас делать» уже принято на ПК, в Аватар.принять() (kuzya_pc.py) —
 * той же логикой character.Питомец, что рисует лицо и на самом роботе.
 * Здесь только отображение: если что-то в модели не совпало (нет такого
 * параметра, нет такого выражения) — молча пропускаем, а не падаем.
 */
const беда = document.getElementById("беда");
function показать(текст) {
  беда.textContent = текст;
  if (текст) console.error(текст);
}

/*
 * Три чужих файла. Их порядок важен: Cubism Core — низкоуровневый движок
 * формата модели, pixi.js — то, чем это рисуется на экране, pixi-live2d-
 * display — мост между ними.
 *
 * Грузятся из кода, а не тегами <script src>: тег с чужого адреса держит
 * первую отрисовку страницы, пока не загрузится, — и без интернета
 * страница остаётся пустой и белой, не сказав ни слова. А эту страницу
 * снимает headless-браузер на ПК и отдаёт роботу на экран: там пустота
 * без объяснения — худшее, что можно показать. Так страница рисуется
 * сразу, а чего не хватает — пишет сама.
 */
const СКРИПТЫ = [
  "https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js",
  "https://cdn.jsdelivr.net/npm/pixi.js@6.5.9/dist/browser/pixi.min.js",
  "https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js",
];
function скрипт(адрес) {
  return new Promise((готово, беда) => {
    const s = document.createElement("script");
    s.src = адрес;
    s.onload = () => готово();
    s.onerror = () => беда(new Error("не загрузился " + адрес));
    document.head.appendChild(s);
  });
}

async function главная() {
  try {
    for (const адрес of СКРИПТЫ) await скрипт(адрес);
  } catch (e) {
    показать("Нужен интернет: " + e.message +
             "\nБиблиотеки Live2D и pixi.js берутся с их сайтов при каждом открытии.");
    return;
  }

  let настройки;
  try {
    const ответ = await fetch("config.json", { cache: "no-store" });
    // fetch не бросает исключение на 404 — страница получила бы чужую JSON-
    // ошибку сервера и приняла бы её за настоящие настройки молча (ровно
    // так и вышло на живом ПК: адрес без хвостового «/» увёл config.json на
    // чужой путь, а «нет такого адреса» — тоже валидный JSON).
    if (!ответ.ok) {
      показать(`config.json: сервер ответил ${ответ.status} ${ответ.statusText}. ` +
               "Открыт ли адрес страницы со слэшем на конце — /avatar/, а не /avatar?");
      return;
    }
    настройки = await ответ.json();
  } catch (e) {
    показать("Не нашёл config.json рядом со страницей: " + e);
    return;
  }
  if (!настройки || !настройки.модель) {
    показать("В config.json нет поля \"модель\" — проверь файл.");
    return;
  }

  const app = new PIXI.Application({
    resizeTo: window,
    backgroundAlpha: 0,
    autoDensity: true,
    resolution: window.devicePixelRatio || 1,
  });
  document.body.appendChild(app.view);

  let модель;
  try {
    модель = await PIXI.live2d.Live2DModel.from(настройки.модель);
  } catch (e) {
    показать("Не загрузил модель «" + настройки.модель + "»: " + e +
             "\nПроверь путь \"модель\" в config.json — .model3.json должен " +
             "лежать по этому пути внутри pc/avatar/.");
    return;
  }
  app.stage.addChild(модель);

  /*
   * ГОТОВЫЕ ПОВЕДЕНИЯ МОДЕЛИ. У любой готовой модели есть свои движения
   * (группы motion: Idle, TapBody, Tap@Head, Flick, Shake…) и выражения
   * (expressions: smile, sad, angry…). Idle библиотека играет сама; остальные
   * подбираем по ИМЕНАМ к поводам сценок и к эмоциям — как это делают
   * настольные виджеты (Live2D Viewer, VTube Studio: «на тап — TapBody»).
   * config.json («движения», «эмоции») перекрывает подбор; пусто в config —
   * берём то, что нашли. Ничего не нашли — молчим: сценка и так двигает
   * голову и корпус стандартными параметрами.
   */
  const группы = Object.keys(((модель.internalModel || {}).motionManager || {}).definitions || {});
  const выражения = ((((модель.internalModel || {}).settings || {}).expressions) || []).map(в => в.Name || v_имя(в));
  function v_имя(в) { return (в && (в.name || в.file || "")) + ""; }
  function найти(список, ...образцы) {
    for (const о of образцы) { const и = список.find(x => о.test(x)); if (и) return и; }
    return "";
  }
  const тап = найти(группы, /^tap$/i, /tap.?body/i, /^tap/i, /tap/i);
  const ДВИЖЕНИЯ_ПО_ПОВОДУ = Object.assign({
    человек_пришёл: тап, услышал_привет: тап, нашёлся: тап, имя: найти(группы, /tap.?head/i, /tap/i),
    // Зовёт внимание (стучит по стеклу, машет) — тот же «тап»: у готовых
    // моделей это самое живое, что есть, и повод как раз про это.
    зовёт_внимание: тап,
    услышал_пока: найти(группы, /wave|bye/i, /tap/i),
    движение: найти(группы, /flick/i, /look/i),
    тревога: найти(группы, /shake/i, /surprise|angry/i),
    рад: найти(группы, /happy|joy|smile/i, /tap/i),
    огорчён: найти(группы, /sad|cry/i),
    музыка_началась: найти(группы, /dance|music/i),
  }, настройки.движения || {});
  const ВЫРАЖЕНИЯ_ПО_ЭМОЦИИ = Object.assign({
    рад: найти(выражения, /smile|happy|joy|laugh/i),
    огорчён: найти(выражения, /sad|cry|tear/i),
    встревожен: найти(выражения, /surprise|shock|angry|scared|fear/i),
    не_понял: найти(выражения, /confus|question|puzzl|think/i),
    спокоен: найти(выражения, /^(normal|default|neutral|idle)$/i),
  }, Object.fromEntries(Object.entries(настройки.эмоции || {}).filter(([, v]) => v)));
  window.__готовые = { группы, выражения, движения: ДВИЖЕНИЯ_ПО_ПОВОДУ, выраженияПоЭмоции: ВЫРАЖЕНИЯ_ПО_ЭМОЦИИ };
  console.info("готовые поведения модели:", JSON.stringify(window.__готовые));

  const базовый_y = () => app.renderer.height * 0.95;
  let масштаб_модели = 1;
  function вписать() {
    модель.scale.set(1);
    const масштаб = Math.min(app.renderer.width / модель.width,
                             app.renderer.height / модель.height) * 0.85;
    масштаб_модели = масштаб;
    модель.scale.set(масштаб);
    модель.anchor.set(0.5, 1.0);
    модель.position.set(app.renderer.width / 2, базовый_y());
    модель.position.x = app.renderer.width / 2;
  }
  вписать();
  window.addEventListener("resize", вписать);

  const ядро = модель.internalModel.coreModel;
  const п = настройки.параметры || {};
  function значение(id) {
    try { return ядро.getParameterValueById(id) || 0; } catch (e) { return 0; }
  }
  function поставить(id, v) {
    // Не у каждой модели есть каждый параметр — молча пропускаем то, чего
    // нет, а не роняем страницу из-за чужого файла модели.
    if (!id) return;
    try { ядро.setParameterValueById(id, v); } catch (e) { /* нет такого */ }
  }

  /*
   * ЭМОЦИИ БЕЗ НАСТРОЙКИ. Выражения (expressions) есть не у каждой модели,
   * и вписывать их имена в config.json никто не обязан. Зато параметры
   * ниже — стандартные для редактора Cubism, они есть почти у любой готовой
   * модели: форма рта, брови, улыбка глаз, поворот головы. Эмоция робота
   * складывается из них. Если для эмоции вписано выражение — работает оно,
   * а параметры не трогаются, чтобы не спорить с ним.
   *
   * Значения — СДВИГИ поверх того, что уже сделала анимация покоя модели
   * (она качает голову и дышит): не заменяем её, а добавляем к ней. Иначе
   * при любой эмоции модель застывала бы, как на фотографии.
   */
  const ЭМОЦИИ = {
    "рад":        { ParamMouthForm: 1.0, ParamEyeLSmile: 1.0, ParamEyeRSmile: 1.0,
                    ParamCheek: 1.0, ParamBrowLY: 0.3, ParamBrowRY: 0.3 },
    "огорчён":    { ParamMouthForm: -1.0, ParamBrowLY: -0.7, ParamBrowRY: -0.7,
                    ParamBrowLForm: -0.6, ParamBrowRForm: -0.6, ParamAngleY: -8 },
    "встревожен": { ParamMouthForm: -0.4, ParamBrowLY: 0.8, ParamBrowRY: 0.8,
                    ParamBrowLForm: 0.5, ParamBrowRForm: 0.5 },
    "не_понял":   { ParamBrowLY: 0.6, ParamBrowRY: -0.4, ParamBrowRForm: -0.5,
                    ParamAngleZ: 10, ParamMouthForm: -0.2 },
    "думаю":      { ParamEyeBallX: 0.7, ParamEyeBallY: 0.7, ParamAngleZ: -6,
                    ParamAngleY: 4 },
    "слушаю":     { ParamAngleY: 6, ParamBrowLY: 0.3, ParamBrowRY: 0.3,
                    ParamMouthForm: 0.3 },
    "сплю":       { ParamAngleY: -20 },
    "спокоен":    {},
  };
  // Всё, что хоть одна эмоция трогает: остальным эмоциям это ставится в
  // ноль, иначе брови «огорчён» остались бы у «рад».
  const ВСЕ_СДВИГИ = new Set();
  for (const э in ЭМОЦИИ) for (const id in ЭМОЦИИ[э]) ВСЕ_СДВИГИ.add(id);

  /*
   * ПУЗЫРЬ С РЕПЛИКОЙ. Сценки (face/scenes.py) иногда «говорят» — коротко,
   * текстом над головой: «Скучно…», «Ку-ку». Это не голос робота (тот
   * звучит из динамика), а мысль персонажа на экране.
   */
  const пузырь = new PIXI.Container();
  const пузырь_фон = new PIXI.Graphics();
  const пузырь_текст = new PIXI.Text("", {
    fontFamily: "sans-serif", fontSize: 30, fill: "#C7D3DD",
  });
  пузырь.addChild(пузырь_фон);
  пузырь.addChild(пузырь_текст);
  пузырь.visible = false;
  app.stage.addChild(пузырь);
  let текст_пузыря = "";
  function показать_пузырь(текст, x, y) {
    if (текст !== текст_пузыря) {
      текст_пузыря = текст;
      пузырь_текст.text = текст;
      пузырь_фон.clear();
      if (текст) {
        const w = пузырь_текст.width + 36, h = пузырь_текст.height + 20;
        пузырь_фон.beginFill(0x161d27, 0.92).drawRoundedRect(-w / 2, -h, w, h, 14).endFill();
        пузырь_текст.anchor.set(0.5, 1.0);
        пузырь_текст.position.set(0, -10);
      }
    }
    пузырь.visible = !!текст;
    пузырь.position.set(x, y);
  }

  let состояние = null;              // последнее, что прислал сервер
  let была_эмоция = "";
  let была_метка = "";
  let была_сценка = "";
  const ЛЕАН_МАКС = 6.0;             // градусов — как в face/character.py
  const плавно = {};                 // id → текущее сглаженное значение
  const наше = {};                   // id → что мы поставили в прошлый кадр
  let прошлый_кадр = performance.now();
  let кадров_из_события = 0;

  function применить(с) {
    // Не затираем текст ошибки кадра: если каждый_кадр() прямо сейчас
    // падает на КАЖДОМ вызове (60 раз в секунду), а состояние с сервера
    // приходит успешно (10 раз в секунду), это «» стирало бы её быстрее,
    // чем кто-либо успел бы её увидеть на экране или в логе kuzya_pc.py.
    if (!последняя_беда_кадра) показать("");
    состояние = с;
    const поза = с.поза || {};

    // Выражение — по эмоции, а не по метке позы: «рад»/«огорчён» это про
    // лицо, а метка («говорит», «танцует») — про то, что делает тело.
    if (с.эмоция !== была_эмоция) {
      была_эмоция = с.эмоция;
      // Из config.json или подобранное по имени у самой модели.
      const имя = ВЫРАЖЕНИЯ_ПО_ЭМОЦИИ[с.эмоция] || "";
      if (имя) { try { модель.expression(имя); } catch (e) { /* нет такого */ } }
    }
    // Танец — по смене метки, а не каждый кадр: иначе motion перезапускался
    // бы на месте тридцать раз в секунду и не доигрывал ни одного такта.
    if (поза.метка !== была_метка) {
      была_метка = поза.метка;
      if (поза.метка === "танцует" && настройки.танец) {
        try { модель.motion(настройки.танец); } catch (e) { /* нет такой группы */ }
      }
    }
    // Сценка началась — и у модели есть своё движение на этот повод: играем
    // его один раз, на старте сценки (а не каждый кадр, см. выше про танец).
    const сцена = с.сцена || {};
    if (сцена.имя !== была_сценка) {
      была_сценка = сцена.имя || "";
      const группа = сцена.имя ? ДВИЖЕНИЯ_ПО_ПОВОДУ[сцена.когда] : "";
      if (группа) {
        window.__сыграно = (window.__сыграно || []).concat([[сцена.когда, группа]]);
        try { модель.motion(группа); } catch (e) { /* нет такой группы */ }
      }
    }
  }

  /*
   * КАЖДЫЙ КАДР, А НЕ ДЕСЯТЬ РАЗ В СЕКУНДУ. Анимация покоя модели переписывает
   * параметры на каждом своём обновлении; то, что поставлено между
   * обновлениями, она затирает, и рот с бровями не двигались вовсе. Поэтому
   * подмешиваемся в само обновление модели — после её движений, до физики
   * (afterMotionUpdate), — и ставим своё поверх того, что она уже сделала.
   */
  // Кадр целиком в try/catch: одна плохая цифра в присланном состоянии
  // (NaN, не число) не должна навсегда остановить оверлей — модель тогда
  // просто дышит своей анимацией покоя, и с виду это неотличимо от «всё
  // сломано», а на деле сломан один параметр одной сценки. Ошибка идёт в
  // «беда» (её видно на экране и в логе kuzya_pc.py, см. _жалоба_страницы),
  // и кадр досчитывается заново со следующего раза — сглаженные значения
  // при этом обнуляются, чтобы залипшая порча (NaN тянется через сглажива-
  // ние бесконечно: NaN*k + NaN тоже NaN) не осталась навсегда.
  let последняя_беда_кадра = "";
  function каждый_кадр() {
    try {
      кадр_без_защиты();
      если_была_беда_кадра_снять();
    } catch (e) {
      const текст = "Кадр не досчитан: " + e;
      if (текст !== последняя_беда_кадра) {
        последняя_беда_кадра = текст;
        показать(текст);
      }
      // Сброс сглаживания: залипший NaN в «плавно»/«наше» иначе тянулся бы
      // вечно — экспоненциальное сглаживание NaN не лечит, только копит.
      for (const id in плавно) delete плавно[id];
      for (const id in наше) delete наше[id];
    }
  }
  function если_была_беда_кадра_снять() {
    if (последняя_беда_кадра) { последняя_беда_кадра = ""; показать(""); }
  }
  function кадр_без_защиты() {
    const сейчас = performance.now();
    const dt = Math.min(0.1, (сейчас - прошлый_кадр) / 1000);
    прошлый_кадр = сейчас;
    if (!состояние) return;
    const с = состояние, поза = с.поза || {};
    const t = сейчас / 1000;
    const эмоция = с.эмоция || "спокоен";
    const говорит = !!с.говорит;
    const танцует = поза.метка === "танцует";
    const своё_выражение = !!(настройки.эмоции || {})[эмоция];

    // Куда стремимся в этом кадре. Сначала — ноль для ВСЕГО, что мы когда-
    // либо сдвигали: параметр, который трогала только сценка (ParamBodyAngleZ,
    // ParamBreath — их нет ни в одной эмоции), иначе застывал бы со сдвигом
    // последней сценки, пока другая сценка не тронет тот же id; проверено —
    // наклон корпуса оставался «запечённым» после «потянулся». Потом сдвиги
    // эмоции...
    const цель = {};
    for (const id in наше) цель[id] = 0;
    for (const id of ВСЕ_СДВИГИ) цель[id] = 0;
    if (!своё_выражение) Object.assign(цель, ЭМОЦИИ[эмоция] || {});
    // ...взгляд на человека: голова и глаза в его сторону...
    const доля_наклона = Math.max(-1, Math.min(1, (поза.наклон || 0) / ЛЕАН_МАКС));
    цель[п.взгляд_x || "ParamAngleX"] = (цель[п.взгляд_x || "ParamAngleX"] || 0) + доля_наклона * 30;
    цель[п.глаза_x || "ParamEyeBallX"] = (цель[п.глаза_x || "ParamEyeBallX"] || 0) + доля_наклона;
    // ...кивки в речи, дрожь в тревоге, покачивание в танце.
    if (говорит) цель.ParamAngleY = (цель.ParamAngleY || 0) + Math.sin(t * 2 * Math.PI * 0.8) * 3;
    if (эмоция === "встревожен") цель.ParamAngleX = (цель.ParamAngleX || 0) + Math.sin(t * 2 * Math.PI * 6) * 2;
    let качание = 0;
    if (танцует) {
      качание = Math.sin(t * 2 * Math.PI * 1.1);
      цель.ParamAngleZ = (цель.ParamAngleZ || 0) + качание * 10;
      цель.ParamBodyAngleX = (цель.ParamBodyAngleX || 0) + качание * 8;
    }
    // Сценка (face/scenes.py) — поверх всего остального: её сдвиги
    // складываются с эмоцией и взглядом, а веки ставятся как есть.
    const сцена = с.сцена || {};
    const веки_сцены = {};
    // Рот сценки — не сдвиг, а абсолютное раскрытие: рот ниже ставится
    // целиком (абсолютно), и сдвиг из этого цикла тут же затирался бы —
    // так «зевнул», «свистит», «смеётся» на Live2D не открывали рта вовсе.
    let рот_сцены = 0;
    for (const id in (сцена.параметры || {})) {
      if (id === "ParamEyeLOpen" || id === "ParamEyeROpen") веки_сцены[id] = сцена.параметры[id];
      else if (id === "ParamMouthOpenY") рот_сцены = сцена.параметры[id] || 0;
      else if (id === "рука_л" || id === "рука_п") {
        // Руки сценки (градусы наружу, 0..60) — в параметр руки ИЗ config.json,
        // если он вписан: имена рук у моделей свои, стандарта нет. Не вписан —
        // жест остаётся в голове и корпусе, которые в той же сценке.
        const парам = п[id];
        if (парам) цель[парам] = (цель[парам] || 0) + (сцена.параметры[id] / 60) * (п.рука_размах || 10);
      }
      else цель[id] = (цель[id] || 0) + сцена.параметры[id];
    }
    // Движение было где-то — туда голова и глаза (сценки про движение).
    if (typeof сцена.к === "number") {
      цель.ParamAngleX = (цель.ParamAngleX || 0) + сцена.к * 25;
      цель.ParamEyeBallX = (цель.ParamEyeBallX || 0) + сцена.к;
    }

    // Сглаживание: эмоция меняется за десятые доли секунды, не рывком.
    const к = 1 - Math.exp(-dt / 0.15);
    for (const id in цель) {
      // Битое число из сценки (не число, NaN) держит эту цель на месте, а
      // не портит остальные: экспоненциальное сглаживание NaN не лечит —
      // раз попав в «плавно», NaN оставался бы там навсегда (NaN*k+NaN=NaN).
      if (!Number.isFinite(цель[id])) цель[id] = плавно[id] || 0;
      const было = плавно[id] || 0;
      плавно[id] = было + (цель[id] - было) * к;
      // Сдвиг — поверх того, что сделала анимация модели. Но параметр, который
      // анимация НЕ трогает, хранит значение с прошлого кадра — вместе с нашим
      // прошлым сдвигом, и складывать поверх него значит копить до бесконечности
      // (проверено: форма рта за секунду уехала в 22). Поэтому: если значение
      // ровно то, что мы поставили в прошлый раз, — никто его не менял, снимаем
      // свой прошлый сдвиг; иначе анимация его переписала, и он уже снят.
      let основа = значение(id);
      const прошлое = наше[id];
      if (прошлое && основа === прошлое.итог) основа -= прошлое.сдвиг;
      const итог = основа + плавно[id];
      поставить(id, итог);
      наше[id] = { итог: итог, сдвиг: плавно[id] };
    }

    // Рот — сразу, без сглаживания: он идёт по звуку, и запаздывать нельзя.
    // Абсолютно, а не сдвигом: рот — наш целиком. Речь и сценка — кто
    // шире, тот и виден: зевок посреди реплики не закроет рта, и реплика
    // не отменит зевок.
    if (!Number.isFinite(рот_сцены)) рот_сцены = 0;   // битое число из config.json/сценки — не открытый рот
    поставить(п.рот || "ParamMouthOpenY",
              эмоция === "сплю" ? 0 : Math.max(0, Math.min(1, Math.max(поза.рот || 0, рот_сцены))));
    // Спит — глаза закрыты. Только во сне: в остальное время моргание модели
    // само владеет веками, и трогать их — значит отучить её моргать. Сценка
    // («притворился спящим», «подмигнул») тоже имеет право на веки — как есть.
    if (эмоция === "сплю") { поставить("ParamEyeLOpen", 0); поставить("ParamEyeROpen", 0); }
    for (const id in веки_сцены) поставить(id, Math.max(0, Math.min(1, веки_сцены[id])));

    // Тело целиком: подскок и покачивание вокруг ступней. Это не параметры
    // модели (не у всех они вообще есть), а сдвиг всей картинки — так танец
    // виден даже на модели без описанных под него движений.
    const W = app.renderer.width, H = app.renderer.height;
    модель.position.y = базовый_y() - (поза.подскок || 0) * (H / 800) + (сцена.y || 0) * H;
    модель.rotation = качание * 0.06 + (сцена.поворот || 0);
    модель.scale.set(масштаб_модели * (сцена.масштаб || 1));
    // Карточка слева (музыка, погода) — робот рисует её поверх этого кадра,
    // и персонаж отходит вправо, освобождая ей место, как и домовёнок на
    // самом роботе (face/character.py). Плавно: шаг в сторону, не прыжок.
    // Сценка может сдвинуть ещё («заглянул за край», «спрятался»).
    const карточка = !!(с.погода) || !!((с.музыка || {}).играет);
    const x_цель = W * (карточка ? 0.66 : 0.5) + (сцена.x || 0) * W;
    модель.position.x += (x_цель - модель.position.x) * (1 - Math.exp(-dt / 0.6));
    показать_пузырь(сцена.текст || "", модель.position.x,
                    модель.position.y - модель.height - 16);
  }
  модель.internalModel.on("afterMotionUpdate", () => { кадров_из_события++; каждый_кадр(); });
  // Если у этой сборки библиотеки такого события нет — хотя бы после её
  // обновления, обычным тикером: хуже (анимация покоя перебивает), но
  // лучше, чем ничего.
  app.ticker.add(() => { if (кадров_из_события === 0) каждый_кадр(); }, null, PIXI.UPDATE_PRIORITY.LOW);

  // Один запрос в полёте, не больше. setInterval не ждёт fetch: пока /state
  // отвечал медленно (ПК занят моделью), запросы копились десятками в
  // секунду и, отвечая разом, ставили состояния вразнобой.
  let опрос_в_полёте = false;
  async function опросить() {
    if (опрос_в_полёте) return;
    опрос_в_полёте = true;
    try {
      let с;
      try {
        const ответ = await fetch("state", { cache: "no-store" });
        if (!ответ.ok) {
          показать(`state: сервер ответил ${ответ.status} ${ответ.statusText}`);
          return;
        }
        с = await ответ.json();
      } catch (e) {
        показать("Нет связи с сервером (" + e + ") — страница ждёт, робот жив?");
        return;
      }
      try {
        применить(с);
      } catch (e) {
        показать("Не применил состояние: " + e);
      }
    } finally {
      опрос_в_полёте = false;
    }
  }
  setInterval(опросить, 100);
  опросить();
}

главная();
</script>
</body>
